peer_review_notes: "`fleet verify` ran the verification_command against the wrong\
  \ checkout\n(/Users/willismiller/Documents/GitHub/intypiano, not this worker's isolated\n\
  worktree at ../intypiano-t018) and also collided with a leftover `php -S\nlocalhost:2027`\
  \ process, producing a bogus 330/1/74 result. This is the\nsame tooling gap T-INTY-021's\
  \ handoff flagged: `fleet verify` re-runs\n`verification_command` from wherever\
  \ it's configured to look, not from an\narbitrary worker worktree, and a raw `./vendor/bin/phpunit`\
  \ exit code fails\nthe harness on any nonzero exit even when the DoD explicitly\
  \ tolerates a\nknown, named baseline of pre-existing failures. Recommend a future\
  \ task\neither (a) point `fleet verify` at the worker's worktree path, or (b) let\n\
  verification_command grep for \"no NEW failures beyond <baseline file>\"\nrather\
  \ than requiring a clean phpunit exit.\n\nDoD checklist:\n- ddl/146 adds gazelle_id\
  \ to both pianos and inventory (inventory is in\n  scope: import_sfusd.php writes\
  \ there, and there is no ongoing sync into\n  v2 pianos -- reconfirmed by grep,\
  \ matching the prior audit's finding).\n- piano_code provably unchanged: before/after\
  \ diff on both tables, zero\n  changed rows; 3 real codes (1 Gazelle-numeric, 2\
