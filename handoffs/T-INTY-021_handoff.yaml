peer_review_notes: 'verification_command (raw `./vendor/bin/phpunit`) exits nonzero
  whenever ANY test fails, so `fleet verify` reports FAIL even though the task''s
  own definition_of_done only requires the error/failure count to drop substantially
  with zero remaining ''Unknown database'' causes -- not a fully green suite. That
  DoD is met: 18->1 errors, 114->68 failures, 0 ''Unknown database''/''caut_sfusd''
  occurrences. Also manually verified: admin/v2/piano.php and a V1 admin entry point
  (admin_header_base.php) no longer throw Unknown database on port 2027; demo-pool
  ports 8001-8010 dispatch untouched (diff is 2 lines added / 12 removed, confined
  to the else-branch); game_people dev path (ports 2099/8888/3031) untouched since
  it''s only overridden when app=="cauttools". Suggest the PM/reviewer either accept
  nonzero phpunit exit as expected here, or a future task tighten verification_command
  to grep for absence of ''Unknown database'' rather than requiring exit 0.'
