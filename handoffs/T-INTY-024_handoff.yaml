  \ script lives only in the session scratchpad,\n    never committed. The test PHP\
  \ server was killed.\n"
peer_review_notes: "Scope note: two things were done beyond the literal \"retarget\
  \ the query\"\ninstruction, both because the DoD (\"verified live against a running\n\
  server\") was otherwise unreachable or the fix would have been unusable by\na human:\n\
  \  - Fixed the renderV2Header()/renderV2Footer() undefined-function fatal\n    error\
  \ (pre-existing, unrelated to this bug) so the page could load at\n    all for live\
  \ testing.\n  - Fixed the makes-listing query (inventory-only -> UNION with pianos)\
  \ and\n    added a models-listing table, since without it a pianos-only tenant\n\
  \    like caut_sfusd would still have an empty \"No pianos found\" table with\n\
  \    no button to click, even though the write path underneath would now be\n  \
  \  correct. The task's own scope note said the tool should let \"a human\n    still\
  \ drive corrections through the form\" -- an empty form doesn't\n    satisfy that\
  \ for the exact tenant this task is about.\nNo fuzzy-matching/typo-correction automation\
  \ was added; every write still\nrequires an explicit human-supplied old/new pair\
  \ submitted through the\nexisting Mass Edit UI.\n"
