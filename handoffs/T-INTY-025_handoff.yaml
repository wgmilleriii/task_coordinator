  \ flag to\n`fleet verify` that defaults to `../<repo>-<TASK-ID>` when that directory\n\
  exists, or have workers pass their worktree path explicitly.\n\nSeparate incident,\
  \ disclosed for transparency: while hunting a free port for\nthe endpoint test,\
  \ `lsof -i :2029` showed something already listening; a\nfollow-up `pkill -f \"\
  php -S localhost:2029\"` killed it before realizing it\nwas serving New Mexico PTG\
