peer_review_notes: 'DoD item 1 (confirmed failure mode): the 403 CSRF branch fires,
  NOT the 401 auth branch. This corrects the coordinator''s original "PHP session
  GC evicts idle session data" hypothesis, which was already logically inconsistent
  (a fully-evicted session would trip the 401 auth check first, since Auth::user()
  runs before Csrf::validate() and both read the same $_SESSION). Reproduced deterministically
  in journalgpt/tests/CsrfRefreshTest.php::testReproduceAuthPassesCsrfFailsIsA403NotA401
  by constructing a session with a valid journalgpt_user_id but a journalgpt_csrf_token
  that differs from the submitted token: upvote.php returns 403 with the CSRF error
  message, confirming auth passes while CSRF fails. True root cause: the only code
  path that rewrites an EXISTING session''s CSRF token is Auth::login() -> session_regenerate_id(),
  which runs on every (re-)authentication. The PHPSESSID cookie is shared across all
  tabs/windows in one browser (not scoped per tab), so a fresh login in ANY tab silently
  updates the cookie used by requests from every other already-open tab. A long-lived
  tab''s next request then authenticates successfully against the NEW session (valid
  user_id), while its DOM-cached csrf_token still reflects the OLD, now-orphaned token
  from before the regeneration -- producing exactly "valid auth + 403 CSRF" with no
  session GC/idle-timing race required. Fix scope implemented in full: (1) new journalgpt/api/csrf_refresh.php
  authenticated endpoint returning a fresh/current session-bound token (401 JSON if
  unauthenticated); (2) journal-chat.js upvote click handler now retries exactly once
  on a CSRF-specific 403 using a freshly fetched token, updating the cached csrfTokenInput.value
  for subsequent actions, before falling back to the existing alert(); (3) journalgpt/tests/CsrfRefreshTest.php
  (new file, follows the AskEndpointTest.php self-runner convention, no PHPUnit, no
  DB required since both endpoints exit() before touching the DB) covers all of DoD
  item 2 (a)/(b)/(c). Chat-send (journal-chat.js:134) and share-conversation (journal-chat.js:548)
  flows were intentionally left untouched per the task''s explicit out-of-scope note;
  only the reported upvote flow was changed.'
