id: T-INTY-018
title: Add dedicated gazelle_id column, decoupled from piano_code
repo: intypiano
priority: P1
lane: ANY
status: OPEN
owner: null
created_at: '2026-08-12T00:00:00-06:00'
dependencies: []
scope:
- Verified live in intypiano_demo (which is anonymized production data, so this
  is not hypothetical) - all 126 inventory.piano_code values already look like
  Gazelle "Piano ID" strings (e.g. '110641', '110801', '152964'), not
  QR-specific codes. import_sfusd.php lines 31, 41-44 confirm the mechanism -
  it reads the Gazelle CSV's 'Piano ID' column and writes it straight into
  inventory.piano_code on import. So piano_code is silently overloaded today
  - it is simultaneously the QR lookup key AND the raw Gazelle identifier - and
  the user has rejected reusing it further, wanting a dedicated gazellecode
  (gazelle_id) column instead.
- CRITICAL - piano_code is not just a database key, it is physically printed
  on QR labels already deployed on real pianos. qr_report_generator.php,
  qr_avery5162_poc.php and piano/index.php all resolve piano_code to a piano
  via '/piano/{piano_code}' links baked into printed/laminated QR codes
  (see PIANO_QR_SETUP.md, 'Test 2 - View Piano Landing Page'). Do NOT regenerate
  or overwrite existing piano_code values - that breaks every QR code already
  taped to an instrument. The correct migration is additive - backfill the new
  gazelle_id column by COPYING the current piano_code value (since today they
  are identical for existing rows), not by moving/renaming the column.
- There are two tables that both currently carry piano_code and need the same
  treatment - v1 inventory (VARCHAR, no visible unique constraint found in this
  scout pass - confirm before writing DDL) and v2 pianos (ddl/132/001_v2_schema.sql
  line 37, VARCHAR(24) NULL, with UNIQUE KEY uniq_piano_code line 49). Note also
  that ddl/132/004_map_pianos.sql is the ONE-TIME migration that originally
  populated pianos.piano_code from inventory - this scout pass found no ongoing
  sync job between the two tables, so confirm whether new inventory rows (e.g.
  from a future SFUSD-style import) ever reach v2 pianos at all, and whether
  gazelle_id needs backfilling on both tables or whether v2 pianos is the only
  target that matters going forward (see docs/experts/schema-catalog.md v2 row).
- New ddl migration - next sequential directory after ddl/145 (currently
  ddl/145/001_piano_floor.sql + 002_verify.php is the highest). Follow that
  file's exact pattern - one ALTER TABLE per .sql file, a companion
  NNN_verify.php, comment block explaining why. Add
  'gazelle_id VARCHAR(24) NULL' (match piano_code's width unless investigation
  shows Gazelle IDs run longer) to pianos (and inventory if the sync question
  above resolves that inventory still matters), with an index - decide UNIQUE
  vs plain KEY based on whether Gazelle IDs are confirmed globally unique
  (a duplicate/failed unique constraint would break future imports, so verify
  before choosing UNIQUE).
- Per CLAUDE.md - never use DatabaseManager::dosql() in migration code, use
  getConnection()->query(). Strict SQL mode stays on - do not add
  SET SESSION sql_mode='' to make a coercion pass. Never target unm_piano,
  unm_piano_readonly or unm_piano_test.
- Update import_sfusd.php to populate the new gazelle_id column with $piano_id
  going forward. Decide and document explicitly what piano_code should hold
  for NEW rows once gazelle_id exists (options - leave piano_code populated
  with the same Gazelle ID as before for continuity with the existing QR
  scheme, or start assigning piano_code independently at label-printing time -
  this is a product decision, not just a schema one, so state the chosen
  behavior in the PR/commit rather than silently picking one).
- Backfill existing rows - UPDATE gazelle_id = piano_code for all rows where
  piano_code looks like a Gazelle ID pattern (investigate whether any current
  piano_code values are NOT Gazelle IDs - e.g. hand-assigned QR codes for
  pianos with no Gazelle record - before blanket-copying every row).
definition_of_done:
- New ddl/<next>/001_*.sql adds gazelle_id to pianos (and inventory if in scope
  per the sync investigation above), with a verify script following the
  ddl/145 pattern, runnable via scripts/migrate.php against intypiano_demo
  (never unm_piano/unm_piano_readonly/unm_piano_test).
- Existing piano_code values are provably unchanged after migration - a before/after
  diff of SELECT id, piano_code FROM pianos shows zero modified rows, and
  qr_avery5162_poc.php / piano/index.php still resolve every existing piano_code
  to the same piano (spot-check at least 3 real codes from intypiano_demo).
- gazelle_id is populated for all rows where the investigation confirms
  piano_code currently holds a Gazelle ID (expected ~126/126 in demo data
  today, but confirm rather than assume 100%).
- import_sfusd.php writes gazelle_id going forward; the chosen behavior for
  piano_code on new imports is explicitly documented in the commit message.
- ./vendor/bin/phpunit still reports the 259-test baseline with 0 new failures.
verification_command: php -S localhost:2027 -t . & sleep 1; php scripts/migrate.php
  --status; ./vendor/bin/phpunit
human_review_required: true
