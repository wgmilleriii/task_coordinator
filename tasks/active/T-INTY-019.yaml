- GAZELLE WEB URL PATTERN - STILL GENUINELY UNKNOWN, DO NOT GUESS. Re-checked per
  this audit's instructions - grepped the whole repo (including the new classes/integration/GazelleAPI.php
  from commit 1ea83713, and admin/v2/normalization.php which uses it) for any Gazelle
  URL. The ONLY Gazelle URL anywhere in the codebase is the private GraphQL API endpoint
  `https://gazelleapp.io/graphql/private` (classes/integration/GazelleAPI.php line
  5) - a machine API endpoint, not a human-facing web app URL, and POSTing GraphQL
  queries there tells you nothing about what path a browser needs to open a piano's
  record (e.g. `/pianos/{id}`, a query string, a UUID-based route, etc - all unconfirmed).
  T-INTY-020 (the parallel Gazelle-sync design task) also does not resolve this -
  it is scoped to the GraphQL API, not the web UI, and its own scope text does not
  mention a web URL either. This repo has no way to discover the answer without a
  live Gazelle account/docs. Per PM instruction, this is not being left as an open-ended
  "confirm before hardcoding" - the Worker MUST NOT guess a URL pattern and ship it.
  Definition of Done below is revised accordingly.
- Small, low-risk UI addition. Add an "Open in Gazelle" button/link to admin/v2/piano.php
  (the Piano Dossier / instrument page shipped in T-INTY-017, integrated with dossier_edit.php)
  that opens the piano's record in the Gazelle CRM in a new tab, built from the new
  pianos.gazelle_id column added by T-INTY-018.
- STOP CONDITION, do not skip - this PM audit re-confirmed the Gazelle web URL pattern
  is genuinely unknown and unresolvable from this repo (see PM note above). Before
  writing any URL-construction code, the Worker MUST ask the user (or whoever owns
  the Gazelle account) for the exact URL pattern used to open a piano record in the
  Gazelle web app - e.g. by opening a piano in the Gazelle UI and reading the address
  bar - and record the confirmed pattern in the commit message. If that answer is
  not obtainable in this session, STOP and hand the task back with the specific blocking
  question ("what is the URL to view a piano record in the Gazelle web UI, given its
  Gazelle ID?") rather than shipping a guessed URL. A guessed URL that silently 404s
  is worse than an admittedly-incomplete feature.
- Render conditionally - if pianos.gazelle_id IS NULL for this piano (e.g. it predates
  the Gazelle integration or was hand-entered), do not show a dead link; either hide
  the button or show a disabled/greyed state with a tooltip explaining why.
- Follow admin/v2/piano.php's existing conventions for buttons/links (CSRF is irrelevant
  here since this is a pure outbound GET link, not a form post, but match the existing
  visual style in that file rather than introducing a new button pattern).
