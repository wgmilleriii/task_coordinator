id: T-INTY-023
title: master_migrate.php has no unm_piano protection; add applied-tracking and a
  dynamic system_hub.php launcher
repo: intypiano
priority: P0
lane: ANY
status: AUDITED
owner: null
created_at: '2026-08-13T00:00:00Z'
dependencies: []
scope:
- 'Confirmed by reading master_migrate.php in full: it loops over every tenant in
  config.php''s `$db_configs` (lines 83-117) and executes arbitrary SQL from a file
  in sql_scripts/ (or repo root) against each one via a raw PDO connection, with no
  per-tenant exclusion list. `$db_configs[''unm'']` (config.php lines 9-13) points
  at `dbname => ''unm_piano''` -- the same production database that scripts/bootstrap_v2_db.sh,
  scripts/migrate.php, and scripts/data_quality.php --fix all explicitly refuse to
  target (see docs/experts/schema-catalog.md "Protected databases" and CLAUDE.md).
  master_migrate.php has no such refusal. This is a real gap, not a hypothetical:
  any .sql file dropped in sql_scripts/ and launched via this tool runs against unm_piano
  today.'
- 'PART 1 -- Protection: port the same refusal pattern already used in scripts/bootstrap_v2_db.sh
  (see its `case "$DB_NAME" in unm_piano|...)` block) into master_migrate.php''s tenant
  loop -- skip (with a clear logged warning, not a silent skip) any tenant whose `dbname`
  is `unm_piano`, `unm_piano_readonly`, or `unm_piano_test`, matched against the actual
  configured `dbname`, not the `$db_configs` key (a tenant could theoretically be
  renamed/aliased).'
- 'PART 2 -- Applied-tracking: master_migrate.php currently has no record of which
  .sql files have already been run against which tenant, unlike the real ddl/ migration
  system''s `ddl_applied` table (see scripts/migrate.php). Add a new table, e.g. `sql_scripts_applied
  (id, filename, tenant, applied_at, applied_by, success, statement_count, error_count)`,
  in the `caut_central` tenant database (config.php `central` entry, dbname `caut_central`)
  -- confirmed via `SHOW TABLES` that caut_central is a small, separate management-console
  schema (age_lookups, password_resets, users, valuations) distinct from the per-tenant
  piano schema, and is the natural home for fleet-wide bookkeeping like this. Write
  a row per (file, tenant) after each tenant''s run completes, whether it succeeded
  or partially failed, so a file that failed on one tenant is visibly distinguishable
  from one that succeeded everywhere.'
- 'PART 3 -- Dynamic launcher: system_hub.php currently has ONE hardcoded link (`master_migrate.php?file=sql_scripts/add_value_age_overrides.sql`)
  under "Global Migrations". Replace it with a dynamic list: scan sql_scripts/*.sql,
  cross-reference against `sql_scripts_applied` (from Part 2) to find files that have
  NOT been successfully applied to every currently-configured tenant, and render each
  as its own launch link/button. A file already applied everywhere should not be relaunchable
  from this list without an explicit "re-run anyway" affordance (out of scope to build
  the re-run affordance itself -- just don''t let the normal list silently invite
  double-application).'
- Do not touch the ddl/ + scripts/migrate.php system itself, and do not attempt to
  unify the two migration mechanisms (ddl/ versioned migrations vs. sql_scripts/ ad-hoc
  fan-out) into one -- that's a larger, separate architectural question. This task
  only makes the existing sql_scripts/ mechanism safer and its state visible, it does
  not redesign it.
- Existing sql_scripts/*.sql files (01_email_migration.sql, 02_sync_user_emails.sql,
  03_enforce_email_unique.sql, 04_seed_central_valuations.sql, add_track_table.sql,
  add_value_age_overrides.sql, baseline_schema_sync.sql, create_busd_db.sql, create_dossier_tables.sql,
  create_ousd_db.sql, create_pending_research_table.sql, create_sfusd_db.sql, rbac_migration.sql)
  have never been run through this tracking mechanism (it doesn't exist yet) -- treat
  all of them as unknown status, not as already-applied. Do NOT auto-mark them applied
  as part of this task; that would be guessing at history that was never recorded.
definition_of_done:
- master_migrate.php refuses (with a clear message, exit code 1 for CLI / visible
  error for web) to execute against any tenant whose configured dbname is unm_piano,
  unm_piano_readonly, or unm_piano_test, verified by running it against a config where
  the unm tenant is present and confirming that tenant is skipped while others still
  run.
- The `sql_scripts_applied` table exists in caut_central (created via a proper migration
  file, not a manual ALTER), and master_migrate.php writes a row to it per tenant
  after every run, verified by running master_migrate.php against a real test .sql
  file locally and querying the resulting rows.
- system_hub.php''s "Global Migrations" card is replaced with a dynamic list driven
  by sql_scripts/*.sql minus what sql_scripts_applied shows as fully applied, verified
  by loading system_hub.php as the global_system role in a running server (php -S
  localhost:2027 -t ., per CLAUDE.md''s "prefer running over reading" rule) and confirming
  the list matches the current filesystem + tracking-table state, with a screenshot
  or terminal evidence attached to the handoff.
- php -l on every changed .php file passes.
- No regression to the existing global_system session-role gate on master_migrate.php
  (non-CLI requests still require session role system_admin/global_system).
verification_command: php -l master_migrate.php && php -l system_hub.php
