scope:
- "Verified by inspection of ledger.json on branch test-T-MIN-001 (worktree checkout\
  \ of commit 0509f69): 93 of the 97 cards already carry identified: true, human_confirmed:\
  \ true, and a populated type/value (Trump/Cups/Swords/ Batons/Coins + rank), but\
  \ current_name still equals original_name for all 93 \u2014 meaning research/evidence/cards_raw/\
  \ still holds them under their raw geographic extraction filenames (e.g. 830124001_card_05.jpg)\
  \ instead of their standardized archival names (e.g. Swords_6.jpg). Only 4 of 97\
  \ cards have actually been renamed."
- CARD_REVIEW_PROCESS_AND_IDENTIFYING.md Step 4 ("Final Standardization") defines
  this rename as the completion step of the identification workflow. The identification
  judgment work is already done and sitting unused in the ledger; this task is purely
  to apply it.
- Write a small one-shot script (e.g. finalize_identifications.py, following the pattern
  of the existing single-purpose scripts in the repo root such as dedupe_cards.py)
  that, for every ledger entry where identified is true and current_name == original_name,
  computes the target archival filename (Trump_N.jpg / <Suit>_N.jpg per the existing
  /api/update naming convention in git history at 2c233c4^:minchiate_reviewer.py),
  renames the file under research/evidence/cards_raw/, and updates current_name in
  ledger.json.
- Must refuse (log and skip, not crash) any rename whose target filename already exists,
  and must be safely re-runnable (a second run against an already-finalized ledger
  is a no-op).
definition_of_done:
- Running the script against the current ledger.json + cards_raw/ renames all 93 pending
  files to their archival names and updates ledger.json's current_name for each.
- Re-running the script immediately afterward makes zero further changes (idempotent),
  verified by hashing ledger.json / directory listing before and after the second
  run.
- No target-name collision silently overwrites an existing file.
- python3 minchiate_reviewer.py --check still exits 0 afterward (renamed files still
  resolve to their sheet geography via original_name's 9-digit prefix, which the sort
  key already reads from original_name rather than current_name).
verification_command: "python3 finalize_identifications.py && python3 finalize_identifications.py\
  \ && python3 -c \"\nimport json, os\nwith open('ledger.json') as f:\n    ledger\
  \ = json.load(f)\nassert len(ledger) == 97, f'expected 97 ledger entries, got {len(ledger)}'\n\
  pending = [k for k, v in ledger.items() if v.get('identified') and v['current_name']\
  \ == v['original_name']]\nassert not pending, f'still pending rename: {pending}'\n\
  missing = [v['current_name'] for v in ledger.values() if not os.path.exists(os.path.join('research/evidence/cards_raw',\
  \ v['current_name']))]\nassert not missing, f'missing files on disk: {missing}'\n\
  print('OK: 97 entries, 0 pending renames, 0 missing files')\n\" && python3 minchiate_reviewer.py\
  \ --check"
