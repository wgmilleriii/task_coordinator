  batch briefs so authoring can be scoped as follow-up tasks.
definition_of_done:
- A triage report in research/pilots/ assigns every one of the ten files a bin with
  evidence (diffs run, ranks recomputed, citations spot-fetched).
- Any file failed as a clone or stub is archived with a disposition note, matching
  the Justice-clone precedent.
