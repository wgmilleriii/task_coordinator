scope:
- "SCOUT-F6 SOURCE: this is D2's direct, already-recorded consequence for T-MIN-013\
  \ (tasks/human/editorial_decisions_2026-08-12.md, D2 section, decided by Chip 2026-08-13).\
  \ D2 itself: branch-based comparative canon \u2014 where documented pattern variation\
  \ exists (e.g. hybrid-bodied vs ordinary-rider Cavaliers), the canon shows both\
  \ authentic historical forms rather than picking one. D2's consequence line, verbatim:\
  \ \"the 16 court cards get a middle tier, not the light tier used for the 40 pips\
  \ \u2014 this is a direct downstream requirement of D2, since a branch-based canon\
  \ needs room for pattern-variation content that the light-tier format doesn't carry.\
  \ A middle-tier format spec for the 16 courts is follow-up work, not yet designed.\"\
  \ This task IS that follow-up work."
- "SCOUT-F6 CONFIRMED THE GAP AND ITS EVIDENCE BASE (dry run against branch test @82721eb,\
  \ 2026-08-13): research/pilots/SUIT_CARD_FORMAT_SPEC.md (T-MIN-013, merged) is the\
  \ light tier and covers only the 56 suit cards uniformly; its \xA76 already flags\
  \ the gap it does not fill (\"the comparison doc ... finds the 16 courts carry load-bearing\
  \ pattern findings (hybrid anatomy, gender presentation) that strain this format;\
  \ it recommends the human consider a middle tier for courts\"). research/pilots/SUIT_TIER_COMPARISON_T-MIN-013.md\
  \ \xA74 states the actual finding driving this: \"CUPS-12 (court) is tighter than\
  \ comfortable: the hybrid-anatomy finding, its relatedness qualification, the gender-presentation\
  \ caution, and the suit-by-suit grid dependency ... are all load-bearing pattern\
  \ findings that the light format holds only by leaning on an existing full dossier.\
  \ The other 15 courts have no such dossier to lean on\" \u2014 and its recommendation:\
  \ \"consider a middle tier for the 16 courts \u2014 the same skeleton plus a bounded\
  \ 'pattern findings' subsection under \xA74 ... and 100% rather than sampled verification\
  \ for the four Cavaliers.\" No middle-tier spec file exists anywhere in research/pilots/\
  \ as of this commit \u2014 confirmed by find/grep, see verification_command."
- "Write research/pilots/COURT_CARD_FORMAT_SPEC.md, a NEW format spec for the 16 court\
  \ cards (Fantina/Fante, Cavalier, Queen, King \xD7 4 suits) that EXTENDS research/pilots/SUIT_CARD_FORMAT_SPEC.md\
  \ \u2014 inherit its skeleton (\xA73), grading legend (\xA72: [F]/[SI]/[SCH]/[LT]/[PS]/[U]/[UNVERIFIED]),\
  \ claim-namespace rule (\xA74), and FORBIDDEN list (\xA75) verbatim or by explicit\
  \ reference; do not duplicate them wholesale or silently diverge from them. ADD\
  \ one new section (a bounded subsection under the iconography baseline, matching\
  \ the comparison doc's \xA74 recommendation) for documented pattern-variation content:\
  \ the format must be able to present MULTIPLE authentic historical forms for a card\
  \ side by side when specimen evidence supports it (the Cavalier of Cups hybrid-bodied-vs-ordinary-rider\
  \ case, per D2, is the concrete example), with EACH form's evidentiary basis and\
  \ confidence stated individually \u2014 not a single blended description, and not\
  \ one form silently preferred over the other."
- "Scope boundary on the policy question: the new section IMPLEMENTS D2's \"show both\
  \ forms\" decision \u2014 it must not relitigate, second-guess, or add conditions\
  \ to whether variant forms get shown. D2 already decided that. The spec's job is\
  \ the mechanics: how a form is stated, sourced, and confidence-graded, and how multiple\
  \ forms coexist in one card study without either being flattened into the other\
  \ or asserted as universal (the light tier's \xA75 FORBIDDEN item \"universalizing\
  \ one specimen or pattern\" carries forward unchanged)."
- "Write ONE pilot card to the new middle tier: SUIT-CUPS-12 (Cavalier of Cups) \u2014\
  \ deliberately the SAME card already covered by both the light-tier pilot (research/pilots/drafts/STANDARD_SUIT-CUPS-12_Cavalier_of_Cups.md)\
  \ and the full dossier (research/pilots/Pilot2_SUIT-CUPS-12_Cavalier_of_Cups.md\
  \ + its JSON), so there are now three treatments of the identical card for direct\
  \ comparison. This is intentional redundancy, matching the project's established\
  \ T-MIN-013 pattern for format-design tasks \u2014 do not substitute a different\
  \ card. The pilot's pattern-findings section must cover the hybrid-anatomy vs ordinary-rider\
  \ finding: BM 1896,0501.35 (corroborated by .103) catalogs ordinary men on horseback\
  \ \"instead of monsters with human bodies,\" the Cups Cavalier survives in that\
  \ pack, and hybrid body is pattern-selectable rather than rank-defining \u2014 carried\
  \ at the same confidence the full dossier gives it (catalog evidence, not re-opened\
  \ at this tier = [UNVERIFIED], per the light-tier pilot's own precedent at claim\
  \ CU12-C06), never upgraded."
- "Write a short comparison note (e.g. research/pilots/COURT_TIER_COMPARISON_T-MIN-021.md,\
  \ or a section appended to COURT_TIER_COMPARISON... naming is the worker's call\
  \ as long as it references all three tiers by filename) answering: what the middle\
  \ tier adds over the light tier (specifically \u2014 does its pattern-findings section\
  \ capture the hybrid-anatomy finding, its BM .35/.103 relatedness qualification,\
  \ and the gender-presentation caution as well as the full dossier does, better,\
  \ or worse), and what the middle tier still does NOT carry versus the full dossier\
  \ (if anything remains). This is the evidence a human needs to decide whether the\
  \ middle tier suffices for all 16 courts, or whether some edge case (e.g. a court\
  \ with MORE than two documented variant forms, or no full dossier to lean on at\
  \ all) still needs full treatment \u2014 flag that open question explicitly if the\
  \ pilot doesn't resolve it, don't paper over it."
- 'OUT OF SCOPE (do not do this work): rolling the middle tier out to the other 15
  court cards: writing prompts, art-direction guidance, or deck-generation-pipeline
  material for branch-variation cards (D2''s own consequence list in tasks/human/editorial_decisions_2026-08-12.md
  names this as separate follow-up); and updating the Visual Canon policy document
  (also D2''s own separate follow-up item). This task is format design plus one pilot
  and its comparison note, nothing more.'
definition_of_done:
- research/pilots/COURT_CARD_FORMAT_SPEC.md exists, explicitly extends (references,
  does not silently fork) SUIT_CARD_FORMAT_SPEC.md's skeleton/legend/claim-namespace/FORBIDDEN
  list, and adds a pattern-variation subsection requiring each documented historical
  form to carry its own evidentiary basis and confidence grade, per D2's "show both
  forms" decision (implemented, not relitigated).
- One SUIT-CUPS-12 (Cavalier of Cups) pilot exists written to the new middle tier,
  distinct from both research/pilots/drafts/STANDARD_SUIT-CUPS-12_Cavalier_of_Cups.md
  (light) and research/pilots/Pilot2_SUIT-CUPS-12_Cavalier_of_Cups.md (full), and
  its pattern-findings section states the hybrid-vs-ordinary-rider finding with per-form
  evidentiary basis and confidence, carried at or below the full dossier's confidence
  (no upgrading).
- A comparison note exists, references all three tiers (light/middle/full) by filename,
  and states explicitly what the middle tier adds over light and what (if anything)
  it still lacks versus full, including whether that gap is acceptable for rollout
  to the other 15 courts or leaves an open edge case.
- Rollout to the other 15 court cards, prompt/art-direction guidance, and the Visual
  Canon policy document are NOT touched by this task.
- "human_review_required is honored \u2014 task ends at HUMAN_REVIEW with the format\
  \ proposal and one pilot, not with additional court cards authored or the Visual\
  \ Canon policy updated."
verification_command: 'bash -c ''set -e; spec=research/pilots/COURT_CARD_FORMAT_SPEC.md;
  test -f "$spec" || { echo "FAIL: middle-tier spec missing"; exit 1; }; grep -qi
  "SUIT_CARD_FORMAT_SPEC" "$spec" || { echo "FAIL: spec does not reference/extend
  the light-tier spec"; exit 1; }; grep -qi "pattern.variation\|pattern.finding" "$spec"
  || { echo "FAIL: spec lacks a pattern-variation/pattern-findings section"; exit
  1; }; grep -qi "evidentiary basis" "$spec" || { echo "FAIL: spec does not require
  each form to state its own evidentiary basis"; exit 1; }; grep -qi "UNVERIFIED"
  "$spec" || { echo "FAIL: spec lacks the inherited provenance-grading rules"; exit
  1; }; pilot=$(find research/pilots -iname "*SUIT-CUPS-12*" -name "*.md" 2>/dev/null
  | grep -v "STANDARD_SUIT-CUPS-12_Cavalier_of_Cups.md" | grep -v "Pilot2_SUIT-CUPS-12_Cavalier_of_Cups.md"
  | grep -vi "COMPARISON" | head -1); test -n "$pilot" || { echo "FAIL: no middle-tier
  SUIT-CUPS-12 pilot distinct from the light and full files"; exit 1; }; grep -qi
  "hybrid" "$pilot" || { echo "FAIL: pilot does not cover the hybrid-anatomy finding";
  exit 1; }; grep -qi "evidentiary basis\|per-form\|per form" "$pilot" || { echo "FAIL:
  pilot does not state per-form evidentiary basis"; exit 1; }; grep -qi "UNVERIFIED"
  "$pilot" || { echo "FAIL: pilot does not carry the hybrid finding at UNVERIFIED
  per light-tier precedent"; exit 1; }; cmp=$(grep -rliE "light" research/pilots/*.md
  2>/dev/null | xargs grep -liE "middle" 2>/dev/null | xargs grep -liE "full" 2>/dev/null
  | grep -iE "COMPARISON" | head -1); test -n "$cmp" || { echo "FAIL: no comparison
  note mentioning all three tiers (light/middle/full)"; exit 1; }; grep -qi "SUIT_CARD_FORMAT_SPEC"
  "$cmp" || { echo "FAIL: comparison note does not reference the light-tier spec filename";
  exit 1; }; grep -qi "Pilot2" "$cmp" || { echo "FAIL: comparison note does not reference
  the full dossier filename"; exit 1; }; echo PASS'''
