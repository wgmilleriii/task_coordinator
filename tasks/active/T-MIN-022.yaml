scope:
- 'SCOUT-F7 REGISTRY FACTS (queried live from research/05-registry-and-audit/Stage5_Master_Card_Registry.csv,
  test at 0ff3c97 on branch test): Swords occupies the contiguous sort-order block
  1-14 (registry column sort_order). The ten pip cards are SUIT-SWORDS-01 through
  SUIT-SWORDS-10, canonical names Ace of Swords through Ten of Swords, Italian Asso
  di Spade through Dieci di Spade, historical_names column simply Ace/One, Two, Three,
  ... Ten -- i.e. the registrys own pip rank labels ARE the plain English ordinals
  Ace-Ten (period Italian numerals Asso, Due, Tre, Quattro, Cinque, Sei, Sette, Otto,
  Nove, Dieci); do not assume some other Minchiate-specific pip naming scheme exists
  in the registry -- it does not. Rank-in-suit for each card = sort_order minus 1
  plus 1 (block start 1), i.e. rank-in-suit equals the cards own -NN suffix for every
  Swords card; show this arithmetic per card, do not just assert it. None of these
  ten cards has a light-tier study yet.'
- 'COURTS EXCLUDED (confirm, do not re-derive from scratch): SUIT-SWORDS-11 (Jack/Fante),
  SUIT-SWORDS-12 (Cavalier/Cavallo), SUIT-SWORDS-13 (Queen/Regina), SUIT-SWORDS-14
  (King/Re) are the four Swords court cards, sort orders 11-14, already scoped under
  the middle court tier (T-MIN-013 pilot 2 of 2; T-MIN-021 middle-tier format, closed
  DONE). They are OUT OF SCOPE here -- do not write, restate, or touch any Swords
  court file under this task.'
- Write all ten pip cards fresh, one file per card, to research/pilots/drafts/STANDARD_SUIT-SWORDS-NN_Card_Name.md
  (NN zero-padded, e.g. STANDARD_SUIT-SWORDS-01_Ace_of_Swords.md), following research/pilots/SUIT_CARD_FORMAT_SPEC.md's
  section skeleton exactly (header block with maturity state and IMG-001 blocker;
  section 1 registry facts [F]; section 2 rank in suit recomputed from sort_order,
  not memory; section 3 scoring sourced-or-absent; section 4 iconography baseline
  at true confidence; section 5 confusion resolvers or 'none required'; section 6
  project reading [PS], at most 10 lines, built only from sections 1-5 anchors; section
  7 boundaries; section 8 mini claims table, 6-12 rows, claim IDs namespaced SW-NN-C-NN
  per the spec's claim-namespace rule). Diff every card against drafts/STANDARD_SUIT-COINS-04_Four_of_Coins.md
  (the working pilot) for structural and disciplinary consistency (line-count band
  60-120, same grading legend, same bounded-transcription caveat wording).
- 'SCORING DISCIPLINE (already settled by the format spec section 3, do not re-litigate
  or invent a new rule): RULE-1790 pp. 5-6 gives five points to each King and none
  to the other thirteen cards of a suit; every captured card (including each Swords
  pip) contributes one card to the captured-card count, never more; no combination
  (verzicola) value is demonstrated on the record for any suit numeral, and no categorical
  exclusion is asserted either -- state this as sourced-or-absent per pip, never invent
  an amount. Swords/Batons are the LONG suits: state their trick order only where
  a witness transcription for the long-suit order is actually on the corpus; otherwise
  mark the ordering [UNVERIFIED] rather than assuming an ascending numeral order by
  default -- do not silently import the round-suit inverse rule, which is sourced
  only for Coins/Cups.'
- No modern cartomancy meanings, no RWS bleed-over (no Ten of Swords ruin scene, no
  sword-suit-as-conflict imagery, no upright/reversed keywords), no elemental/astrological/Kabbalah/numerology
  correspondences, no unsourced point amounts or combination values -- identical discipline
  to every batch this project has run (trump/arie/papi-fool/zodiac/element).
- 'Work in waves with self-verification before final submission, matching the trump/arie/papi-fool
  batch pattern: recompute every section-2 rank-in-suit line against the registry
  sort_order column, check every claims-table row resolves to a source cell or an
  explicit [UNVERIFIED]/absent marker, grep every drafted file for forbidden terms
  (pentacles, upright, reversed, Water/Earth-as-suit, RWS scene names), and diff each
  card against the Four of Coins pilot for format-skeleton and line-count consistency.'
- Write a batch verification report at research/pilots/Swords_Pip_Batch_Verification_Report.md
  with a per-card verdict (PASS / PASS_WITH_CORRECTIONS / FAIL) for all ten cards
  and a recomputation table showing each card's sort_order, block-start arithmetic,
  and resulting rank-in-suit.
- 'OUT OF SCOPE: the four Swords court cards (already handled, see above); any modern
  cartomancy content; any point value, card count, or combination reach not traceable
  to a named witness and locator; any other suit''s cards.'
definition_of_done:
- All ten files research/pilots/drafts/STANDARD_SUIT-SWORDS-01_*.md through STANDARD_SUIT-SWORDS-10_*.md
  exist, each following the SUIT_CARD_FORMAT_SPEC.md skeleton (header/maturity/IMG-001
  blocker, sections 1-8 present, claims table with SW-NN-C-NN IDs), each 60-120 lines,
  none containing a court card id (SUIT-SWORDS-11 through -14) or forbidden terms
  from the spec's section 5 list.
- research/pilots/Swords_Pip_Batch_Verification_Report.md exists, naming all ten SUIT-SWORDS-01..10
  card ids with a verdict and recomputed rank-in-suit for each.
- Every section-2 rank-in-suit arithmetic line is recomputed from the registry's sort_order
  column (block start 1), not asserted from memory.
- Every section-3 scoring statement is sourced (RULE-1790 pp. 5-6 as transcribed via
  the Four of Coins pilot's claim chain, or the Justice pilot's verzicola hedge where
  relevant) or explicitly marked absent/[UNVERIFIED] -- no invented amounts.
verification_command: "python3 -c 'import re, glob, sys\n\nsuit = \"SWORDS\"\nexpected\
  \ = [\"01\",\"02\",\"03\",\"04\",\"05\",\"06\",\"07\",\"08\",\"09\",\"10\"]\nreport_prefix\
  \ = \"Swords_Pip_Batch_Verification_Report\"\ncourt_ids = [f\"SUIT-{suit}-{n}\"\
  \ for n in [\"11\",\"12\",\"13\",\"14\"]]\nmarkers = [\"Maturity state\", \"IMG-001\"\
  , \"Claims table\", \"Rank in suit\", \"Scoring (sourced or absent)\"]\n\nfiles\
  \ = glob.glob(\"research/pilots/drafts/STANDARD_SUIT-%s-*.md\" % suit)\nfound =\
  \ {}\nfor f in files:\n    try:\n        text = open(f, encoding=\"utf-8\").read()\n\
  \    except Exception:\n        continue\n    ids = set(re.findall(r\"SUIT-%s-\\\
  d{2}\" % suit, text))\n    if len(ids) != 1:\n        continue\n    nn = ids.pop().split(\"\
  -\")[-1]\n    if nn not in expected:\n        continue\n    missing = [m for m in\
  \ markers if m not in text]\n    if missing:\n        print(\"MISSING MARKERS\"\
  , f, missing); continue\n    nlines = len(text.splitlines())\n    if not (60 <=\
  \ nlines <= 120):\n        print(\"LINE COUNT OUT OF BAND\", f, nlines); continue\n\
  \    leaked = [cid for cid in court_ids if cid in text]\n    if leaked:\n      \
  \  print(\"COURT ID LEAKED INTO PIP FILE\", f, leaked); continue\n    found[nn]\
  \ = f\n\nmissing_ids = [n for n in expected if n not in found]\nif missing_ids:\n\
  \    print(\"MISSING/INVALID CARDS\", missing_ids); sys.exit(1)\n\nreports = glob.glob(\"\
  research/pilots/%s*.md\" % report_prefix)\nif not reports:\n    print(\"NO REPORT\"\
  ); sys.exit(1)\nrtext = open(reports[0], encoding=\"utf-8\").read()\nrmissing =\
  \ [n for n in expected if (\"SUIT-%s-%s\" % (suit, n)) not in rtext]\nif rmissing:\n\
  \    print(\"REPORT MISSING IDS\", rmissing); sys.exit(1)\nif not re.search(r\"\
  PASS(_WITH_CORRECTIONS)?|FAIL\", rtext):\n    print(\"REPORT MISSING VERDICT KEYWORDS\"\
  ); sys.exit(1)\n\nprint(\"OK, found\", len(found), \"cards\")\nsys.exit(0)'"
