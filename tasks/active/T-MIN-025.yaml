verification_command: "python3 -c 'import re, glob, sys\n\nsuit = \"COINS\"\nexpected\
  \ = [\"01\",\"02\",\"03\",\"05\",\"06\",\"07\",\"08\",\"09\",\"10\"]\nreport_prefix\
  \ = \"Coins_Pip_Batch_Verification_Report\"\ncourt_ids = [f\"SUIT-{suit}-{n}\" for\
  \ n in [\"11\",\"12\",\"13\",\"14\"]]\nmarkers = [\"Maturity state\", \"IMG-001\"\
  , \"Claims table\", \"Rank in suit\", \"Scoring (sourced or absent)\"]\n\nfiles\
  \ = glob.glob(\"research/pilots/drafts/STANDARD_SUIT-%s-*.md\" % suit)\nfound =\
  \ {}\nfor f in files:\n    try:\n        text = open(f, encoding=\"utf-8\").read()\n\
  \    except Exception:\n        continue\n    ids = set(re.findall(r\"SUIT-%s-\\\
  d{2}\" % suit, text))\n    if len(ids) != 1:\n        continue\n    nn = ids.pop().split(\"\
  -\")[-1]\n    if nn not in expected:\n        continue\n    missing = [m for m in\
  \ markers if m not in text]\n    if missing:\n        print(\"MISSING MARKERS\"\
  , f, missing); continue\n    nlines = len(text.splitlines())\n    if not (60 <=\
  \ nlines <= 120):\n        print(\"LINE COUNT OUT OF BAND\", f, nlines); continue\n\
  \    leaked = [cid for cid in court_ids if cid in text]\n    if leaked:\n      \
  \  print(\"COURT ID LEAKED INTO PIP FILE\", f, leaked); continue\n    found[nn]\
  \ = f\n\nmissing_ids = [n for n in expected if n not in found]\nif missing_ids:\n\
  \    print(\"MISSING/INVALID CARDS\", missing_ids); sys.exit(1)\n\nreports = glob.glob(\"\
  research/pilots/%s*.md\" % report_prefix)\nif not reports:\n    print(\"NO REPORT\"\
  ); sys.exit(1)\nrtext = open(reports[0], encoding=\"utf-8\").read()\nrmissing =\
  \ [n for n in expected if (\"SUIT-%s-%s\" % (suit, n)) not in rtext]\nif rmissing:\n\
  \    print(\"REPORT MISSING IDS\", rmissing); sys.exit(1)\nif not re.search(r\"\
  PASS(_WITH_CORRECTIONS)?|FAIL\", rtext):\n    print(\"REPORT MISSING VERDICT KEYWORDS\"\
  ); sys.exit(1)\n\nprint(\"OK, found\", len(found), \"cards\")\nsys.exit(0)'"
