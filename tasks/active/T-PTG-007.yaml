  ''who writes the most articles?'' -> ''enuermate the top 10 most frequent contributoprs'' (typos preserved
  verbatim) -> ''list the names of their articles along with them''.'
- 'This is a genuinely new cognitive mode beyond the 4 T-PTG-006 covers (factual retrieval / synthesis
  / speculative / sentiment aggregation): a question that requires a COUNT or RANKING across the entire
  corpus, which a single ~20-chunk semantic retrieval architecturally cannot produce reliably — it only
  ever sees a small, unrepresentative sample, never the full corpus.'
- Production evidence (debug_logs id=15) shows the model DID verbally hedge ('did not specify a definitive
  list... a comprehensive ranking... is not available in the provided excerpts') but still printed a confident-looking
  numbered 1-10 list beneath that caveat — the visual formatting undercuts the verbal honesty.
definition_of_done:
- Scenario executed across enough preset/tier combinations to know whether the hedge-but-still-rank behavior
  is consistent or occasional (model-specific).
- 'Determine whether the current verbal caveat is sufficient, or whether a concrete change is warranted:
  e.g. system-instruction guidance requiring the model to state the sample-vs-corpus limitation BEFORE
  presenting any list for a count/ranking question, or to avoid a definitively-numbered list format entirely
  when the underlying data is acknowledged incomplete.'
- If a fix is implemented, verify it doesn't regress the 4 existing cognitive modes (T-PTG-005/006 coverage)
  or the citation-format checks.
- Findings written up (task_coordinator/feedback/) with a clear recommendation even if the conclusion
  is 'current hedged behavior is acceptable, no code change needed' — per the skill, 'no action needed'
  is a valid outcome.
