id: T-PTG-008
title: Tag-triggered feature-request conversation lane, parallel to the citation-grounded
  RAG pipeline
repo: newmexicoptg.org
priority: P2
lane: ANY
status: AUDITED
owner: null
created_at: '2026-08-12T00:00:00Z'
audited_at: '2026-08-12T19:38:08.881170Z'
audited_by: PM-PTG-FeatureRequest1
audited_repo_sha: 2915a622d26b0dfa151f5da6070cad4c9688d3ae
dependencies: []
scope:
- 'PROBLEM: Every message today runs through one pipeline: index.php UI -> AJAX POST
  -> api/ask.php -> Authorization::requireRole() -> Csrf::validate() -> UsagePolicy::checkAllowance()
  -> JournalAnswerService::ask() -> OpenAI File Search against the vector store ->
  citation/page-marker resolution -> messages/usage_events rows -> JSON response with
  citations[] and is_grounded. The product owner wants a second conversation type
  for feature requests that a member explicitly tags in their own message text (their
  design decision, e.g. a leading ''/feature request'' marker -- explicit tagging
  was chosen specifically over auto-intent-classification, which would misfire on
  genuinely ambiguous messages like ''does PTG have a source on X, or is that a gap'').
  A tagged message must skip the RAG pipeline entirely: no getActiveVectorStoreId()/callOpenAIResponsesApi()
  call, no resolveCitationsFromChunks(), no fallbackExtractCitationsFromAnswer(),
  no citations[] or is_grounded badge in the response (there is nothing to cite).
  Instead it enters a conversational triage flow: the assistant acknowledges the idea
  and asks clarifying questions (who runs into this, how often, what would the feature
  look like) across multiple turns, the way a human PM/Scout would triage an idea,
  until ''enough'' detail exists.'
- 'ROUTER LOCATION: journalgpt/api/ask.php (lines ~60-111 in the current file) is
  the single place every question passes through before JournalAnswerService::ask()
  is called. The router that detects the tag belongs here, immediately after CSRF
  validation and before the tier/preset/model resolution -- so a feature-request message
  never reaches getActiveVectorStoreId(), the OpenAI call, or the citation resolver
  at all. A companion decision: does the tag have to be the first token of the message
  (simplest, matches the PM''s own ''/feature request'' example), or is it detected
  anywhere in the text? The PM must pick one and say why -- ''anywhere in the text''
  risks false positives on a technical question that happens to mention wanting a
  feature.'
- 'PARALLEL SERVICE: journalgpt/lib/JournalAnswerService.php is entirely citation-machinery
  (parsePageMarkers, resolveCitationsFromChunks, fallbackExtractCitationsFromAnswer,
  collapseAdjacentPageCitations, the Zero-Guessing withholding logic at lines ~414-437).
  None of that applies to a feature-request turn. Build a parallel service (e.g. FeatureRequestService,
  new file under journalgpt/lib/) with its own system prompt -- conversational PM/Scout
  persona, explicitly NOT grounded-in-corpus, asks about who/how-often/what-it-would-look-like
  -- and its own ''ask''-shaped entry point that still goes through OpenAIClient but
  with no vector_store_id / file_search tool attached. Decide and document what ''enough
  detail'' means to end the triage and close out the conversation: a minimum covered-dimension
  set (e.g. who + frequency + desired behavior all mentioned across turns) or the
  member explicitly saying they''re done (e.g. ''that''s everything'' / a UI ''submit
  request'' action) -- and note this is a judgment call, not something to leave fully
  open-ended, since a Worker needs a concrete stopping condition to implement and
  test against.'
- 'QUOTA DECISION (surface, do not silently assume): UsagePolicy::checkAllowance()
  enforces DEFAULT_MEMBER_MONTHLY_QUOTA=100/month, DEFAULT_MAX_DAILY_REQUESTS=30/day,
  and the org-wide DEFAULT_ORG_MONTHLY_BUDGET_USD=$100.00 hard cap (usage_events.estimated_cost
  summed for the month, journalgpt/lib/UsagePolicy.php lines 38-136). A feature-request
  turn still calls OpenAI (for the conversational reply) and still costs real tokens,
  so it should very likely still count against the org monthly dollar cap regardless
  of the per-user question quota decision -- letting feature-request turns bypass
  the budget cap entirely would let a member run the org''s spend to zero with proposals,
  not questions, which is a real cost-control loophole to avoid, not a hypothetical
  one. Whether it counts against the member''s personal monthly QUESTION quota (100/month)
  is a genuine product call the PM should make explicit in the audited scope one way
  or the other -- e.g. ''feature-request turns are exempt from monthly_question_quota
  because they''re not drawing on the corpus (the whole point of the quota), but multi-turn
  triage still costs real API tokens/dollars so it counts fully against org_monthly_budget_usd
  via usage_events'' is a defensible default, but the PM should state the choice,
  not let it fall out of whichever code path is easiest to write.'
- 'STORAGE AND THE task_coordinator QUESTION -- the crux of this feature: journalgpt/
  is a PHP app on GoDaddy-style FTP shared hosting. .github/workflows/deploy.yml confirms
  this: it is a push-triggered FTP sync (SamKirkland/FTP-Deploy-Action) to test/main
  branches, and it explicitly EXCLUDES **/.git, **/.github, **/docs, **/tasks, and
  **/*.md from the deployed file set. The deployed production PHP process therefore
  has no git checkout of task_coordinator on the server, no git binary usable from
  a web request in any believable shared-hosting configuration, and no filesystem
  path to a sibling repo''s tasks/active/ directory -- a live api/ask.php request
  writing directly into task_coordinator/tasks/active/*.yaml is not achievable as
  described and must not be the design. The buildable answer: completed feature-request
  conversations get stored in journalgpt''s OWN MySQL database (a new table, e.g.
  feature_request_conversations or a type/status flag added to the existing conversations
  table -- messages already exist per-turn in the messages table via the existing
  role/content/citations_json schema in migrations/001_journal_ai.sql, so the per-turn
  content can likely reuse messages with citations_json left null for this lane) with
  a status such as draft/gathering/complete. A SEPARATE, later, human-or-agent-run
  step -- a Scout invoked periodically by a developer, or a small CLI script under
  journalgpt/cli/ or journalgpt/spikes/ (the repo already has this pattern: spikes/run_seed_users.php
  is a standalone web/CLI-runnable script) -- queries the DB for status=complete feature-request
  conversations, formats the gathered requirements into a task.schema.json-conformant
  YAML, and writes it into task_coordinator/tasks/active/ from a machine that actually
  has both repos checked out. The production PHP app itself must never touch task_coordinator
  directly, must never shell out to git, and must never assume a filesystem path to
  a sibling repo exists. Document this pull-based handoff explicitly in whatever design
  doc or PR description implements this task -- don''t leave it implicit in code.'
- 'AUTH/DB CONTEXT: journalgpt/lib/Auth.php and Authorization.php gate api/ask.php
  with Authorization::requireRole(null) (any authenticated member) before anything
  else runs -- a feature-request-tagged message still needs a logged-in member, same
  as today. journalgpt/migrations/001_journal_ai.sql is the baseline schema (users,
  conversations, messages, usage_events, application_settings); migrations/008_shared_conversations_and_tiers.sql
  and 009_debug_logs.sql are later additions worth reading before designing a new
  table or column, so the PM/Worker doesn''t collide with an existing conversations.*
  column or duplicate a concept already added (e.g. check whether 008 already introduced
  any conversation ''tier'' or ''type'' concept that this feature could extend instead
  of duplicating).'
- 'DECISION 1 (tag matching): The tag MUST be the first token of the trimmed message
  body, case-insensitive (e.g. `/feature request ...` or `/feature-request ...`),
  not detected anywhere in the text. Rationale confirmed by reading api/ask.php: a
  substring/anywhere-in-text match risks misrouting a genuine technical question that
  happens to mention wanting a feature (the Scout''s own example) into the non-grounded
  triage lane, silently withholding a corpus-grounded answer the member was entitled
  to. First-token matching is a single trim() + str_starts_with() check immediately
  after CSRF validation in api/ask.php (~line 58), before tier/preset/model resolution
  -- cheap, deterministic, and testable with a fixed string, unlike an anywhere-match
  which would require the Worker to invent and justify a heuristic.'
- 'DECISION 2 (stopping condition): ''Enough detail'' = a concrete, machine-checkable
  dimension-coverage set, not a model self-assessment. The triage is COMPLETE when
  all three dimensions -- who (which member/role hits this), how often (frequency/impact),
  and what it would look like (desired behavior) -- have each been extracted into
  a structured field (not just present somewhere in raw text) across the turns, OR
  the member explicitly ends the flow via a closing phrase / ''submit request'' UI
  action, whichever comes first. The per-turn structured extraction (e.g. a small
  JSON object {who, how_often, what} progressively filled in and stored per-turn or
  on the conversation row) IS the mechanism the DoD''s ''sufficient for later extraction
  into a task_coordinator YAML'' requirement depends on -- storing only free-text
  turns would fail that DoD bullet even if the conversation reads correctly to a human,
  because a later automated script needs fields, not prose to re-parse. The Worker
  must implement and test this dimension-tracking explicitly, not leave it to model
  judgment embedded in a system prompt.'
- 'DECISION 3 (quota): CONFIRMED as the Scout''s suggested default, verified against
  the actual UsagePolicy.php queries (read directly, not assumed): getMonthlyUserQuestionCount()
  filters usage_events on event_type = ''query'', while getMonthlyOrgSpend() sums
  estimated_cost with NO event_type filter. This means the clean, low-risk implementation
  is: feature-request turns write their own usage_events rows with a distinct event_type
  (e.g. ''feature_request'') and a real estimated_cost -- they are automatically excluded
  from the per-user monthly_question_quota count (which only counts event_type=''query'')
  while automatically still counting toward org_monthly_budget_usd (which sums all
  rows regardless of event_type). This requires NO change to UsagePolicy.php''s existing
  logic or its passing test suite -- confirmed by running UsagePolicyTest.php locally
  (5/5 passed) against the current schema. The Worker must NOT route feature-request
  cost through a codepath that skips writing to usage_events entirely, or the org
  budget cap becomes bypassable (the exact loophole the Scout flagged).'
- 'DECISION 4 (migration 008 / conversation type): CONFIRMED via direct read of migrations/001_journal_ai.sql,
  008_shared_conversations_and_tiers.sql, and 009_debug_logs.sql (009 is the latest,
  is unrelated -- debug_logs table only): 008 does NOT introduce a conversation type/category
  concept. The `tier` column 008 adds (to `messages` and `usage_events`) encodes MODEL
  tier (quick/medium/deep) -- an orthogonal concept to conversation category and must
  not be conflated or reused for this feature. The `conversations` table (001) has
  no type/category column at all; 008 only added `is_public`/`share_slug` to it. The
  Worker must add a NEW column, e.g. `conversations.conversation_type ENUM(''rag'',''feature_request'')
  NOT NULL DEFAULT ''rag''` (naming at Worker''s discretion, but must be a new, clearly-named
  column, not an overload of `tier`), via a new migration (010_*.sql, following the
  existing numbering convention).'
- 'VERIFICATION NOTE (PM, 2026-08-12): .github/workflows/deploy.yml read directly
  -- confirmed the exclude list on both the test and main FTP deploy jobs includes
  **/tasks, **/tasks/**, **/.github, **/.github/**, **/docs, **/docs/**, and **/*.md.
  The Scout''s claim that production PHP has no path to task_coordinator is correct
  as described. Also confirmed the DB_HOST=127.0.0.1 test pattern is real and works:
  ran `DB_HOST=127.0.0.1 DB_NAME=journal_ai_test DB_USER=root DB_PASS=root php journalgpt/tests/AskEndpointTest.php`
  and `.../UsagePolicyTest.php` against a local MySQL 9.3.0 instance -- both suites
  passed end-to-end (3/3 and 5/5 respectively) including DB-backed assertions, not
  just the anonymous/CSRF checks that run without a DB connection. This repo''s ''prove
  it against a running server'' testing convention is real and the Worker can and
  must use it for the DoD''s multi-turn and no-regression requirements -- a code-only
  assertion is not an acceptable substitute where the harness already exists and works.'
definition_of_done:
- A message beginning with the agreed feature-request tag, POSTed to api/ask.php,
  does NOT trigger a call to getActiveVectorStoreId(), callOpenAIResponsesApi() with
  a vector_store_id attached, or any citation-resolution method on JournalAnswerService
  -- verified by either a code-path assertion/test double or by inspecting debug_logs
  for that request showing no vector store usage.
- The JSON response for a tagged message contains no citations array with real entries
  and no is_grounded:true citation badge signal -- the frontend has nothing to render
  as a 'Sources Grounded in Journal' chip for this lane.
- A multi-turn feature-request conversation is observable end-to-end -- at least 2-3
  back-and-forth turns where the assistant's replies are conversational triage questions
  (who/how often/what it would look like), not corpus-grounded answers, and this is
  demonstrated against a running server per this repo's own testing convention (DB_HOST=127.0.0.1
  php journalgpt/tests/... pattern), not asserted from reading code.
- The 'enough detail to close out' stopping condition implemented is concrete and
  testable (e.g. a specific set of dimensions detected as covered, or an explicit
  user confirmation action) -- not left as a vague 'the AI decides it has enough'.
- A completed/closed feature-request conversation produces a well-formed row (or set
  of rows) in journalgpt's own MySQL DB with enough structured content that a later,
  separate script could turn it into a task_coordinator/tasks/active/*.yaml file conforming
  to schemas/task.schema.json -- this task's DoD does NOT include writing that separate
  extraction script/Scout, only proving the stored data is sufficient for one to exist.
  Note that clearly in the eventual PR/handoff so a follow-on task can pick up the
  extraction step.
- The quota/budget decision from scope (whether feature-request turns count against
  monthly_question_quota, and confirmation they DO count against org_monthly_budget_usd)
  is implemented consistently with whatever the PM audits it to be, and existing UsagePolicy
  tests / the 259-test-baseline-equivalent suite for this repo still pass.
- Existing RAG-pipeline behavior for untagged messages is unchanged -- no regression
  in citation resolution, Zero-Guessing withholding, or the 4-5 cognitive modes covered
  by T-PTG-005/006/007.
