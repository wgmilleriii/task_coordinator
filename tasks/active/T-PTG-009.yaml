    set of variants the product owner confirmed (space / no-space / hyphen, case-insensitive,
    leading-whitespace-tolerant) and explicitly excluded fuzzy/typo matching and anywhere-in-body
    detection per the product owner's direction, to avoid reopening the false-positive
    risk T-PTG-008's PM audit closed.
