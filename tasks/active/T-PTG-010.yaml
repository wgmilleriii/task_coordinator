scope:
- 'See docs/superpowers/specs/2026-08-12-contributor-index-design.md and docs/superpowers/plans/2026-08-12-contributor-index.md
  for the full design and task-by-task implementation plan; this task''s scope is
  exactly what those documents specify. Do not re-derive the design or re-plan the
  work -- the plan already gives 7 concrete tasks with exact file paths and code
  (migration 011_contributor_index.sql, lib/ContributorNormalizer.php, the ingestion
  hook in lib/CorpusIndexer.php, cli/backfill_contributors.php, lib/ContributorStatsService.php,
  and the api/ask.php router wiring), and a PM/Worker should follow it directly rather
  than reinvent it.'
- 'PROBLEM (production evidence in the design doc, not hypothetical): a member asked
  who writes the most articles (debug_logs id=14/15/16, conversation_id=47, 2026-08-12)
  and JournalGPT correctly followed the T-PTG-007 answer-policy hedge (docs/answer-policy.md
  section 2.3) rather than answering, because there is no verified way to count authorship
  today -- articles.author is free text, never normalized into an entity. The hedge
  is not an answer; this task builds the entity index and query lane needed to actually
  answer the question the member asked.'
- 'DELIVERABLE SUMMARY: a new contributors / article_contributors schema (normalizing
  the existing articles.author free-text field into real entities), a ContributorNormalizer
  that splits/matches author strings against existing contributors by normalized_key,
  an ingestion hook in CorpusIndexer that keeps new articles in sync automatically,
  a one-time cli/backfill_contributors.php for already-indexed articles, a ContributorStatsService
  that answers count/ranking questions with a SQL GROUP BY templated into text, and
  a fixed-phrase router in api/ask.php (mirroring FeatureRequestService::isTagged()''s
  discipline from T-PTG-008/009) that sends matching questions to this new lane before
  the existing RAG dispatch runs.'
- 'LOAD-BEARING CONSTRAINT 1 (no vector store from this path): the new query path
  must never call OpenAI File Search or the vector store -- it answers entirely from
  the SQL entity index. A Worker adding any getActiveVectorStoreId()/callOpenAIResponsesApi()
  call inside ContributorStatsService or the new router branch is out of scope and
  wrong.'
- 'LOAD-BEARING CONSTRAINT 2 (no LLM-generated numbers): the substantive answer --
  names, counts, ranking -- is composed by template/string-formatting from a SQL
  result set, never generated by the model. This is what makes the answer verifiable
  instead of a second hedge-shaped hallucination risk.'
- 'LOAD-BEARING CONSTRAINT 3 (fixed router, no NLU): router matching in api/ask.php
  is a fixed, explicit phrase/pattern list for authorship count/ranking questions
  (e.g. combinations of who/which + most/top N/frequent + article(s)/contributor(s)/writer(s)/author(s)),
  the same discipline T-PTG-008/009 already established for the feature-request tag
  -- not fuzzy matching, not an intent classifier.'
- 'LOAD-BEARING CONSTRAINT 4 (pending, never auto-merge): when ContributorNormalizer
  cannot confidently match a raw author-string fragment to an existing contributors.normalized_key,
  it must create a NEW contributors row with review_status=''pending'' -- it must
  never auto-merge a low-confidence match into an existing contributor, since a wrong
  merge silently inflates one person''s count with someone else''s articles. pending
  rows still count in aggregations (excluding them would silently undercount); the
  review queue exists to catch bad splits, not to gate counting.'
- 'LOAD-BEARING CONSTRAINT 5 (miss falls through unchanged): if the router does not
  match a question, behavior must be completely unchanged from today -- fall through
  to the existing RAG pipeline exactly as before. A missed phrasing must degrade
  to today''s hedge behavior, never produce a new wrong-looking answer.'
- 'MARKER CONVENTION: debug_logs already has a preset column used by FeatureRequestService
  to mark its lane (preset=''feature_request''); this task uses the same existing
  column with preset=''contributor_index'' for turns answered by ContributorStatsService
  -- do not add a new column for this (the design doc''s prose mentions a retrieval_mode
  marker, but the implementation plan -- the authoritative task-by-task source --
  specifies reusing debug_logs.preset; follow the plan).'
definition_of_done:
- All 7 tasks in docs/superpowers/plans/2026-08-12-contributor-index.md are implemented
  as specified (migration 011_contributor_index.sql; ContributorNormalizer with resolveAndLink();
  the CorpusIndexer ingestion hook; cli/backfill_contributors.php; ContributorStatsService;
  the api/ask.php router wiring).
- 'New test files pass: journalgpt/tests/ContributorNormalizerTest.php (including
  the DB-backed resolveAndLink() tests and the explicit pending-not-auto-merge assertion),
  the appended test in journalgpt/tests/CorpusIndexerTest.php, and journalgpt/tests/ContributorStatsServiceTest.php
  (router phrase matching, including a genuine RAG question that happens to mention
  ''contributor''/''author'' correctly NOT matching, and the templated SQL answer
  content).'
- 'The full existing suite still passes with zero regressions: journalgpt/tests/AskEndpointTest.php,
  journalgpt/tests/UsagePolicyTest.php, journalgpt/tests/JournalAnswerServiceTest.php,
  and journalgpt/tests/FeatureRequestServiceTest.php all run clean against the DB_HOST=127.0.0.1
  DB_NAME=journal_ai_test DB_USER=root DB_PASS=root convention.'
- 'Concrete proof this fixes the real production problem: re-running DB_HOST=127.0.0.1
  DB_PORT=3306 DB_NAME=journal_ai_test DB_USER=root DB_PASS=root php journalgpt/tests/manual_conversation_matrix.php
  journalgpt/tests/scenarios/frequent_contributors_aggregate.json scholarly quick
  (the same T-PTG-007 scenario that previously produced a hedge) now produces a debug_logs
  row with preset=''contributor_index'' instead of the old hedge-and-RAG behavior.'
- All four load-bearing constraints above are confirmed true by reading the diff,
  not just inferred from tests passing -- no vector-store call added to the new path,
  no LLM-generated count/ranking text, router is a fixed phrase list, and low-confidence
  matches create pending contributors rather than auto-merging.
