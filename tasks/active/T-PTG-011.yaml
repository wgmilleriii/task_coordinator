scope:
- 'PROBLEM (reported directly by the product owner, Chip, live in production): clicking
  the "Good Answer" upvote button on an assistant message in journalgpt returns the
  JSON error `{"status":"error","error":"Invalid or missing CSRF security token."}`
  with HTTP 403, instead of toggling the upvote. Confirmed by reading journalgpt/api/upvote.php:66
  -- this exact string is only emitted from the `Csrf::validate($csrfToken)` failure
  branch.'
- 'CONFIRMED VIA CODE READING (not yet reproduced against a live failing session --
  see DoD): journalgpt/assets/journal-chat.js:14 caches `csrfTokenInput` ONCE at page-load
  time via `document.querySelector(''input[name="csrf_token"]'')`, and the upvote
  click handler (journal-chat.js:456-473) reads `csrfTokenInput.value` and POSTs it
  unchanged to api/upvote.php. This value is never refreshed for the lifetime of the
  page. journalgpt/lib/Csrf.php::validate() compares that submitted value against
  `$_SESSION[''journalgpt_csrf_token'']` via `hash_equals` -- if the server-side session
  no longer contains the same token the page was rendered with, validation fails regardless
  of what the browser sends.'
- 'LEADING HYPOTHESIS FOR WHY THE SESSION-SIDE TOKEN GOES STALE (confirmed by absence,
  not yet confirmed as the actual trigger -- see DoD): journalgpt/lib/Auth.php::startSession()
  sets the session cookie with `''lifetime'' => 0` (i.e. the PHPSESSID cookie persists
  client-side until the browser/tab is closed) but sets no corresponding `session.gc_maxlifetime`
  or `session.cookie_lifetime` ini override anywhere in the codebase (grep of journalgpt/lib/Config.php
  and journalgpt/lib/Auth.php confirms no session.* ini_set calls exist). This means
  the server-side session DATA (including the CSRF token) expires according to the
  HOST''S default `session.gc_maxlifetime` (commonly as short as 1440s / 24 minutes
  on shared hosting), while the cookie referencing that session ID lives on in the
  browser much longer. A member who opens a conversation, reads a long AI answer for
  more than ~24 minutes (very plausible for a technical piano-repair answer), and
  then clicks "Good Answer" would be POSTing a csrf_token value tied to session data
  the server has already garbage-collected -- producing exactly this symptom. Ruled
  out as unrelated: response headers on https://newmexicoptg.org/journalgpt/index.php
  show `cache-control: no-store, no-cache, must-revalidate` and no CDN (`server: Apache`,
  no cf-/x-cache headers), so this is NOT a page-caching bug serving a stale token
  from a shared cache to multiple sessions.'
- 'NO SERVER-SIDE LOGGING OF THIS FAILURE EXISTS TODAY: journalgpt/api/debug_logs.php
  only logs entries from the ask/RAG pipeline (question, model, retrieved_chunks_count,
  etc.) -- confirmed by inspecting a live pull of that endpoint, which contains zero
  fields related to upvote, csrf, or 403s. There is no production evidence log to
  point to for this specific failure the way T-PTG-009 had debug_logs.php?id=22 --
  the PM/Worker must reproduce this locally (e.g. by starting a session, letting it
  idle past the host''s session.gc_maxlifetime or manually clearing the session store
  entry server-side, then attempting the upvote with the original page''s stale token)
  rather than relying on a production log line.'
- 'REGRESSION SURFACE: the same "read csrfTokenInput.value once at page load, never
  refresh" pattern is also used by the chat-send flow (journal-chat.js:134) and the
  conversation-delete-or-similar flow (journal-chat.js:548) -- both POST the same
  cached token to their respective endpoints. If the fix introduces a token-refresh-and-retry
  mechanism, consider (but do not require without explicit scoping below) whether
  it should be shared plumbing rather than upvote-only, since the same idle-session
  failure mode could in principle hit those flows too -- though only the upvote button
  has been reported as broken so far, so do not silently change the other two flows''
  behavior without a corresponding DoD item covering them.'
- 'FIX SCOPE: (1) Add a small authenticated endpoint (e.g. journalgpt/api/csrf_refresh.php)
  that calls `Csrf::generate()` and returns the current session-bound token as JSON
  -- this works whether or not the old session data was GC''d, since `Csrf::generate()`
  creates a fresh token in `$_SESSION` if none exists. (2) In journal-chat.js''s upvote
  click handler, on receiving a 403 response whose body error matches the CSRF failure
  message, transparently fetch a fresh token from the new endpoint, update the cached
  `csrfTokenInput.value` (so subsequent actions on the same page also use the refreshed
  token), and retry the original upvote POST exactly once before surfacing an error
  to the user. Only if the retry also fails should the existing `alert(resData.error
  ...)` fire. (3) Confirm `Auth::user()` (the auth check at upvote.php:22, which runs
  BEFORE the CSRF check) still correctly reports the user as logged in during this
  scenario -- if PHP session GC evicted the CSRF token, it also evicted `journalgpt_user_id`,
  meaning the user is fully logged out server-side even though the cookie is still
  present. If that is the actual behavior, the auth-required branch (upvote.php:19-27)
  would fire first with a 401, not the CSRF branch with a 403 -- the Worker MUST verify
  which failure mode actually reproduces before assuming the CSRF-retry fix alone
  is sufficient. If it turns out to be the 401/logged-out case instead of (or in addition
  to) the CSRF case, the DoD below must be revised and the task returned to AUDITED
  with corrected scope rather than shipping a fix for the wrong branch.'
- 'EXPLICITLY OUT OF SCOPE: do not change `session.gc_maxlifetime` or the cookie `lifetime`
  globally as a first-line fix -- that only narrows the reproduction window, it does
  not eliminate the underlying race between client-cached token and server session
  state (e.g. a user with two tabs open, or a server restart clearing in-memory session
  storage, would still hit it). The retry-on-403 pattern in FIX SCOPE item (2) is
  the required durable fix; a longer session lifetime may be proposed as a supplementary
  feedback item but is not required DoD.'
definition_of_done:
- 'Before writing any fix, the Worker reproduces the exact failure locally and records
  in this task''s events log (or the handoff) which HTTP status/branch actually fires
  first when a session''s server-side data is evicted while the client still holds
  the old cookie and cached CSRF token: the 401 auth-required branch (upvote.php:19-27)
  or the 403 CSRF branch (upvote.php:56-63) or both in sequence. This determines whether
  the fix in the next item needs to also handle a 401-then-relogin case.'
- journalgpt/api/csrf_refresh.php (new file) exists, requires an authenticated session
  (returns 401 JSON if not logged in, matching the existing pattern in upvote.php),
  and returns `{"status":"success","csrf_token":"<64-char-hex>"}` by calling `Csrf::generate()`.
- The upvote click handler in journal-chat.js retries exactly once on a CSRF-specific
  403, using a freshly fetched token, before falling back to the existing error alert.
  A successful retry updates the button/badge UI exactly as a normal successful upvote
  does -- no visible error flashes to the user on the retried success path.
- 'A new automated test file, journalgpt/tests/CsrfRefreshTest.php (or added coverage
  in an existing relevant test file if the Worker judges that cleaner -- state the
  choice and reasoning in the handoff), following this repo''s existing tests/ self-runner
  convention (see AskEndpointTest.php), proves: (a) csrf_refresh.php returns a valid
  token for an authenticated session, (b) it returns 401 for an unauthenticated session,
  and (c) upvote.php still correctly rejects a request whose csrf_token does not match
  the current session token (i.e. the existing security guarantee is unchanged, only
  the client-side recovery behavior is new).'
- The existing test suite still passes in full -- journalgpt/tests/AskEndpointTest.php,
  journalgpt/tests/UsagePolicyTest.php, and journalgpt/tests/JournalAnswerServiceTest.php
  all run clean (0 failures).
- The handoff explicitly states which failure mode (401, 403, or both) was confirmed
  as the actual production trigger, so the PM/human reviewer can judge whether the
  shipped fix actually covers the reported bug rather than a plausible-but-wrong theory.
