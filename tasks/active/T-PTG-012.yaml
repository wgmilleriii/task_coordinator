  verification in Task 9 -- use the `/browse` skill per this project''s CLAUDE.md,
  exactly as the plan itself already states.'
definition_of_done:
- Plan Tasks 3 through 8 are each implemented exactly as specified in docs/superpowers/plans/2026-08-12-color-schemes.md
  (index.php wired with flash-prevention script + picker in the engine-controls-bar;
  source.php, admin_migrate.php, changelog.php, and login.php migrated off their own
  hardcoded `:root` blocks onto the shared journal-chat.css variables per each task's
  variable-mapping table, each with a picker added; featured.php and help.php get
  the flash-prevention snippet + switcher script + picker without needing variable
  migration). Each task's own Step-N verification command (grep counts, `php -l`)
  in the plan passes as specified before moving to the next task.
- 'Plan Task 9''s automated regression check passes: `cd journalgpt && php tests/JournalAnswerServiceTest.php
  && php tests/AskEndpointTest.php` both report full pass with 0 failures.'
- Plan Task 9's manual cross-theme visual verification is performed via the `/browse`
  skill (never `mcp__claude-in-chrome__*` tools directly, per this project's CLAUDE.md)
  across all 4 themes on index.php and all 6 migrated utility pages, confirming readable
  contrast and no leftover hardcoded-dark elements, with any issues found fixed and
  re-verified per the plan's own Task 9 Step 4.
- The `worktree-color-schemes` branch is merged into `main` and pushed, after all
  of the above passes clean -- the feature is verified live in production (a member
  visiting index.php sees a working Theme picker and can switch themes) before this
  task is submitted for review.
- The handoff notes explicitly confirm which of Tasks 3-9 were newly completed by
  this task (all of them, per the confirmed gap above) and that Tasks 1-2's existing
  work was left untouched, not redone.
