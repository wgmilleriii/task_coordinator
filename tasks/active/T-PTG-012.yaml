  (wiring `index.php`, migrating `source.php`/`admin_migrate.php`/`changelog.php`/`login.php`
  off their own hardcoded dark-only `:root` blocks onto the shared variables, adding
  pickers to `featured.php`/`help.php` which already share the variables, and the
  final manual cross-theme visual pass) are entirely unstarted, despite Task 1/2''s
  underlying plumbing already existing on the branch. Nothing here is reachable by
  a member today -- there is no UI control anywhere to change the theme, which fully
  explains the "hasn''t been implemented" report.'
- 'WHY THIS IS NOT A NEW SCOUT/PM DESIGN TASK: the plan at docs/superpowers/plans/2026-08-12-color-schemes.md
  is already complete, self-reviewed (see its own "Self-Review Notes" section confirming
  full spec coverage), and written to the level of literal diffs and exact verification
  commands per task. This fleet task''s job is EXECUTION of the plan''s remaining
  Tasks 3-9 exactly as written, continuing on the existing `worktree-color-schemes`
  branch/worktree (do not start a fresh worktree or branch) -- not re-planning or
  re-designing the feature.'
- 'HOW TO EXECUTE: the plan document itself instructs "Use superpowers:subagent-driven-development
  (recommended) or superpowers:executing-plans to implement this plan task-by-task."
  The Worker should follow that instruction directly, working inside `.claude/worktrees/color-schemes`
  on the `worktree-color-schemes` branch, starting at Task 3 (Task 1 and 2 are already
  done and must not be redone or reverted). Each task''s own commit step in the plan
  should be followed as written (one commit per task, matching the plan''s prescribed
  commit messages) so history stays legible.'
- 'SCOPE BOUNDARY: this task covers finishing Tasks 3-9 of the existing plan AND merging
  the resulting `worktree-color-schemes` branch to `main` once Task 9''s manual verification
  passes clean -- the feature is not "done" from the product owner''s perspective
  until it is live in production, matching the bar T-PTG-009 and T-PTG-008 were held
  to. Do not leave the finished work stranded on the branch again.'
- 'EXPLICITLY OUT OF SCOPE (per the plan''s own Global Constraints, do not relitigate):
  more than the 4 specified themes (light/dark/sepia/ptg); server-side persisted theme
  preference; `prefers-color-scheme` auto-detection; any new CSS variable names beyond
