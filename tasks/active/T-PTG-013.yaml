scope:
- 'PROBLEM (reported directly by the product owner, Chip, live in production): selecting
  a different theme from the Theme picker on https://newmexicoptg.org/journalgpt/changelog.php
  does not visibly change the page''s colors.'
- 'CONFIRMED VIA CODE READING (not yet reproduced live -- see DoD; could not log in
  during Scout investigation, no test credentials available to the Fleet Coordinator):
  `journalgpt/index.php:162` links its stylesheet with a cache-busting query param
  -- `<link rel="stylesheet" href="assets/journal-chat.css?v=<?= htmlspecialchars($gitCommitHash,
  ENT_QUOTES, ''UTF-8'') ?>">` -- so every deploy that changes `$gitCommitHash` forces
  browsers to fetch a fresh copy. ALL SIX other pages that link this same stylesheet
  (`journalgpt/changelog.php:44`, `source.php:209` (line shifted after T-PTG-012''s
  edits, re-grep to confirm), `admin_migrate.php:63`, `login.php:69`, `featured.php:94`
  (`help.php`, confirm exact line via grep)) link the PLAIN, un-versioned URL: `<link
  rel="stylesheet" href="assets/journal-chat.css">`. Confirmed via `curl -sI https://newmexicoptg.org/journalgpt/assets/journal-chat.css`
  that the server sends no `Cache-Control` header at all for this file (only `last-modified`
  and `etag`), so browsers fall back to HTTP heuristic caching and may keep serving
  a stale cached copy of `journal-chat.css` indefinitely for any browser that first
  fetched it before T-PTG-012''s Dark/Sepia/PTG `[data-theme="..."]` blocks (or before
  today''s final page-wiring deploy) were added.'
- 'WHY THIS MATCHES THE REPORTED SYMPTOM: the picker''s `setTheme()`/`applyTheme()`
  logic (in `theme-switcher.js`, confirmed correct and unit-tested by T-PTG-012) only
  sets `document.documentElement.dataset.theme` -- it does not touch any CSS. If a
  visitor''s browser is serving a cached pre-T-PTG-012 copy of `journal-chat.css`
  (one with no `[data-theme="dark"]`/`[data-theme="sepia"]`/`[data-theme="ptg"]` blocks
  at all), the `data-theme` attribute changes correctly but there is no matching CSS
  rule to apply, so the page visually never changes -- exactly the reported behavior.
  `changelog.php` specifically was also touched by an EARLIER, unrelated commit today
  (`183e5fb Add v3 whitepaper teaser to changelog and featured pages`, which predates
  T-PTG-012''s picker-wiring work), making it plausible the product owner loaded this
  exact page in his browser earlier today (to check the new whitepaper teaser banner)
  and has been holding a stale cached `journal-chat.css` ever since.'
- 'NOT YET CONFIRMED -- REQUIRES REPRODUCTION: this is the Scout''s leading hypothesis
  from code reading, not a live-reproduced root cause. The Worker must first ask the
  product owner (or reproduce directly) whether a hard refresh (Cmd+Shift+R / disabling
  cache in DevTools) on changelog.php makes the picker work correctly. If a hard refresh
  fixes it, this confirms the caching theory and the fix below is sufficient. If a
  hard refresh does NOT fix it, there is a second, currently-unknown bug and the Worker
  must investigate further (check `theme-switcher.js` wiring specifically on this
  page, check for a JS error in the console, check whether the picker''s `<option>`
  values actually match `VALID_THEMES`) before assuming the caching fix alone resolves
  the report.'
- 'FIX SCOPE: add the same cache-busting query param pattern index.php already uses
  to the `journal-chat.css` `<link>` tag on all six pages that currently lack it (`changelog.php`,
  `source.php`, `admin_migrate.php`, `login.php`, `featured.php`, `help.php`). Reuse
  whatever mechanism produces `$gitCommitHash` in `index.php` (grep for its definition/computation
  in index.php or a shared lib -- likely `lib/Config.php` or similar) so the version
  string stays consistent across all seven pages rather than each page computing its
  own. If `$gitCommitHash` is only computed inline in index.php today, factor it into
  a small shared helper (e.g. a function in an existing lib file) so all seven pages
  call the same source of truth -- do not duplicate the git-hash-lookup logic seven
  times.'
- 'EXPLICITLY OUT OF SCOPE: do not add a `Cache-Control` header to journal-chat.css
  itself as an alternative fix -- the cache-busting query param is the pattern this
  codebase already established for index.php and is the smaller, more consistent change.
  Do not touch theme-switcher.js unless the reproduction step in the DoD reveals a
  second bug beyond caching.'
definition_of_done:
- Before writing the fix, the Worker either gets direct confirmation from the product
  owner that a hard refresh resolves the reported symptom on changelog.php, or independently
  reproduces the stale-cache behavior (e.g. by loading the page, then reverting journal-chat.css
  locally to a pre-T-PTG-012 version, restarting a local PHP server, loading the page
  once to seed a browser cache, restoring the real file, then reloading normally without
  a hard refresh, and confirming the picker fails to visibly recolor the page) --
  and records which method was used and what was found in the handoff.
- All seven pages (`index.php`, `changelog.php`, `source.php`, `admin_migrate.php`,
  `login.php`, `featured.php`, `help.php`) link `journal-chat.css` with an identical
  cache-busting query-param pattern, sourced from one shared helper (not seven independent
  computations).
- php -l passes on all seven modified/verified files.
- The existing test suite still passes in full -- journalgpt/tests/AskEndpointTest.php,
  journalgpt/tests/UsagePolicyTest.php, and journalgpt/tests/JournalAnswerServiceTest.php
  all run clean (0 failures).
- The handoff explicitly states whether the caching theory was confirmed as the actual
  root cause, or whether a second bug was found and fixed -- so the human reviewer
  can judge whether the reported symptom is actually resolved, not just whether a
  plausible-sounding fix shipped.
