scope:
- 'BACKGROUND: conversation_id=51 (https://newmexicoptg.org/journalgpt/index.php?c=51)
  is the exact real member conversation from T-PTG-009''s evidence -- the member typed
  `/featurerequest different color schemes` on 2026-08-12, and because the tag router
  had a bug at the time (fixed same day by T-PTG-009), it fell through to the RAG
  pipeline and returned a confusing non-answer instead of being triaged as a feature
  request. Confirmed via `debug_logs.php?conversation_id=51`: exactly one log row
  (id 22), `status: uncertain`, `is_grounded: 0`. Since the tag never matched, this
  conversation''s `conversation_type` is almost certainly the default `rag`, NOT `feature_request`
  -- confirm this directly rather than assuming (query `SELECT conversation_type FROM
  conversations WHERE id = 51`). There is correspondingly no `feature_request_details`
  row for it (that table has a UNIQUE key on `conversation_id` and is only populated
  by the tagged lane). The product owner (Chip) wants this member to know their request
  WAS heard and has now shipped (T-PTG-012, live on main as of commit 604d1be, confirmed
  working by Chip in production), even though the original conversation never got
  properly triaged at the time.'
- 'WHY A NEW TOOL, NOT A DB SCRIPT: Chip explicitly chose to have a small reusable
  admin tool built (over doing this one-off via direct SQL, and over just replying
  himself in the UI) so this capability exists for future announcements too, per a
  direct conversation with the Fleet Coordinator.'
- 'PRECEDENT ON ACCESS CONTROL -- READ CAREFULLY BEFORE CHOOSING A ROLE CHECK: `journalgpt/admin_migrate.php:26`
  deliberately calls `Authorization::requireRole(null)` (any authenticated user, not
  `Authorization::ROLE_ADMIN`), with an explicit comment: "Any authenticated pilot
  user may run migrations -- the only production login is a ''member''-role account,
  not ''administrator''." This means gating the new tool to `ROLE_ADMIN` would make
  it completely unusable in production today, since no admin-role account currently
  exists there (confirm this directly: `SELECT id, role_id FROM users` against the
  local test DB structure / or note that this must be verified against production
  separately since local test DB seed data may differ). Match `admin_migrate.php`''s
  existing precedent: `Authorization::requireRole(null)` for pilot-stage access. This
  is a real, acknowledged tradeoff (any logged-in member could, in principle, post
  into any conversation) -- do not silently "fix" it by adding an admin-only gate
  that would lock the product owner out; if you believe the security posture needs
  to change, say so explicitly in the handoff as a recommendation, but do not unilaterally
  change the access model for this one tool while every other admin-ish tool in this
  codebase uses the looser pattern.'
- 'FIX SCOPE -- the tool: a new page, e.g. `journalgpt/admin_reply.php`, gated with
  `Authorization::requireRole(null)` (matching admin_migrate.php), CSRF-protected
  (`Csrf::field()`/`Csrf::enforce()` or the same pattern used elsewhere in this codebase
  -- check `Csrf.php` for the established helper), presenting: a form to enter a `conversation_id`
  and a message body, validates the conversation exists (404/clear error if not),
  inserts a new row into `messages` with `role = ''assistant''` and the given `content`,
  and shows a success confirmation with a link to view that conversation. Word the
  inserted message so it reads as a note from the team, not as if the AI itself generated
  it as an answer -- do not have the tool auto-prepend any specific wording; let the
  admin type the exact message text (this keeps the tool general-purpose for future
  announcements, per why a Chip wanted this reusable).'
- 'FIX SCOPE -- the one-time use: after the tool exists and is verified working, use
  it once to post into conversation 51 a short message from Chip/the team letting
  the member know their color-scheme request shipped (Chip did not dictate exact wording
  to the Fleet Coordinator -- write something warm, brief, and accurate: mention the
  4 themes (Light/Dark/Sepia/PTG) and that the picker is available on every page.
  Do not overclaim or invent detail beyond what T-PTG-012 actually shipped.'
- 'EXPLICITLY OUT OF SCOPE: do not build a general-purpose "broadcast to all conversations"
  or bulk-messaging feature -- this is a single-conversation reply tool. Do not add
  the ROLE_ADMIN gate discussed above. Do not attempt to backfill a `feature_request_details`
  row for conversation 51 or reclassify its `conversation_type` -- that''s a separate,
  more invasive change not requested here; a plain reply message is sufficient for
  what Chip asked for.'
definition_of_done:
- 'A new automated test file, journalgpt/tests/AdminReplyTest.php, following this
  repo''s existing self-runner tests/ convention, covers: (a) an authenticated member
  can successfully post a reply into an existing conversation and a new `role=assistant`
  message row is created with the exact submitted content, (b) an unauthenticated
  request is rejected (matching the existing `Authorization::requireRole(null)` pattern''s
  behavior), (c) a request with a missing/invalid CSRF token is rejected, (d) a request
  targeting a non-existent conversation_id returns a clear error and does not insert
  a row.'
- journalgpt/admin_reply.php exists, is reachable by any authenticated pilot user
  (member or administrator role), and its form successfully posts a message into a
  real conversation when manually tested via the `/browse` skill (never `mcp__claude-in-chrome__*`
  tools directly, per this project's CLAUDE.md) against a local dev server with a
  test user and a test conversation.
- Using the finished tool (not a raw SQL script), exactly one new message is posted
  into production conversation_id=51 with role=assistant, notifying the member that
  the color-scheme feature they requested has shipped. Confirm this by querying the
  message afterward (or via debug_logs.php-equivalent visibility if applicable) and
  record the exact message content and its new message id in the handoff.
- php -l passes on journalgpt/admin_reply.php.
- The existing test suite still passes in full -- journalgpt/tests/AskEndpointTest.php,
  journalgpt/tests/UsagePolicyTest.php, and journalgpt/tests/JournalAnswerServiceTest.php
  all run clean (0 failures).
