  php journalgpt/tests/AskEndpointTest.php && DB_HOST=127.0.0.1 DB_NAME=journal_ai_test
  DB_USER=root DB_PASS=root php journalgpt/tests/UsagePolicyTest.php && DB_HOST=127.0.0.1
  DB_NAME=journal_ai_test DB_USER=root DB_PASS=root php journalgpt/tests/JournalAnswerServiceTest.php
  && DB_HOST=127.0.0.1 DB_NAME=journal_ai_test DB_USER=root DB_PASS=root php journalgpt/tests/AdminReplyTest.php
  && php -l journalgpt/admin_reply.php && php -l journalgpt/cli/promote_admin.php
