scope:
- 'CONTEXT FOR ANY AGENT PLATFORM PICKING THIS UP: read journalgpt/v3/v3.md sections
  4 (Primary Problem), 8-9 (Research Planner, Multi-Query Journal Search), and 28-29
  (Code Organization, Target JournalAnswerService Flow) before starting. This is Phase
  1''s second deliverable, building on T-PTG-018''s ConversationStateService (already
  DONE if you can claim this task -- the fleet dependency check enforces it).'
- 'WHAT TO BUILD, per v3.md section 8 exactly: create `journalgpt/lib/ResearchPlanner.php`.
  Given a member''s question plus recent conversation plus T-PTG-018''s persistent
  conversation state, it must determine (structured output, NOT prose meant for the
  member -- v3.md is explicit: "Planner output must be structured data, not prose
  intended for the user" and "Do not expose private model chain-of-thought"): user
  intent, the underlying technical topic, relevant prior context, PTJ-likely terminology,
  whether multiple searches are needed, and what kind of answer is expected. v3.md
  gives a full example JSON shape (intent/topic/search_queries) -- read it directly.'
- 'INTEGRATION POINT, per v3.md section 9 and the real production evidence in T-PTG-015''s
  benchmark: this is what fixes the exact failure mode documented there -- a member
  typing a bare "why?" or "what about an upright?" as a follow-up, which the current
  pipeline treats as a standalone, context-free question. The planner must consult
  T-PTG-018''s ConversationStateService to resolve such follow-ups against the actual
  prior topic.'
- 'DO NOT WIRE THIS INTO THE LIVE ANSWER PATH YET: build ResearchPlanner.php as a
  standalone, independently testable unit (matching v3.md section 28''s target architecture
  where JournalAnswerService.php becomes "primarily an orchestrator" -- that orchestration
  wiring is a LATER integration step, not this task). Do not modify JournalAnswerService.php''s
  actual production `ask()` flow in this task -- that risks a live regression before
  the full pipeline (retrieval, ranking, synthesis, validation) exists to actually
  consume the planner''s output correctly. Building it in isolation first, proven
  against the benchmark''s follow-up examples via direct unit tests, is the safer
  sequencing.'
- 'EXPLICITLY OUT OF SCOPE: EvidenceRetriever, EvidenceRanker, AnswerSynthesizer,
  ClaimValidator (all later phases). Wiring ResearchPlanner into the live `ask()`
  endpoint (a follow-up integration task once Phase 2''s retrieval work also exists,
  since a planner alone with no new retrieval to consume its multi-query output isn''t
  useful in production yet).'
definition_of_done:
- ResearchPlanner.php exists per v3.md section 8's shape, consumes T-PTG-018's ConversationStateService
  output plus recent conversation, and returns structured planning data (not prose).
- A new test file (journalgpt/tests/ResearchPlannerTest.php) demonstrates, using at
  least 2 of T-PTG-015's benchmark follow-up examples (the "why?" and "what about
  an upright?"-style cases) as fixtures, that the planner correctly resolves the follow-up's
  intent using persistent conversation state rather than treating it as context-free.
- 'GOLDEN HAMMER GATE (hard requirement, per Chip''s explicit direction this session):
  before merging to main, run `DB_HOST=127.0.0.1 DB_NAME=journal_ai_test DB_USER=root
  DB_PASS=root php journalgpt/tests/security_and_eval_suite.php` and confirm 9/9 PASS
  with zero regressions -- the current app must keep working exactly as before for
  members using it today while this v3 work proceeds in parallel.'
- The existing test suite still passes in full (AskEndpointTest.php, UsagePolicyTest.php,
  JournalAnswerServiceTest.php, ConversationStateServiceTest.php) -- 0 regressions,
  since this task does not touch the live answer pipeline.
- php -l passes on all new/modified PHP files.
- The handoff states explicitly that ResearchPlanner is NOT yet wired into the live
  ask() endpoint, per this task's scope, and names which future task should do that
  integration (Phase 2's retrieval task, once EvidenceRetriever exists to consume
  multi-query plans).
