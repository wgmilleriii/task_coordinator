scope:
- 'FINDING: Chip asked that no future work be pushed to main without running the full
  "golden hammer" regression suite (`journalgpt/tests/security_and_eval_suite.php`,
  which runs 8 PHP suites plus the Python eval_runner.py -- 9 suites total). Running
  it as a baseline check surfaced one pre-existing failure: `JournalChatRenderTest.php:115`
  asserts the rendered `index.php` HTML contains the exact literal substring `href="assets/journal-chat.css"`
  (no query string). `index.php`''s actual stylesheet link has ALWAYS included a cache-busting
  `?v=<hash>` query param (confirmed via git history -- this predates every task from
  today''s session), so this exact-substring assertion has likely been failing since
  the test was first written (single commit in its git history, `b89a4d7`, never updated
  since). This is a stale/wrong test assertion, not a real product bug -- confirmed
  the actual rendered HTML is correct and functional (T-PTG-013 extended the same
  versioned-link pattern to 6 more pages earlier today specifically because it is
  the correct, intentional behavior).'
- 'FIX SCOPE: update `journalgpt/tests/JournalChatRenderTest.php:115` to check for
  a pattern that tolerates the version query string, e.g. a regex or `strpos` on `href="assets/journal-chat.css?v=`
  (matching the actual, correct, intentional markup) instead of the exact stale string.
  Do not weaken the assertion into something that would pass regardless of correctness
  (e.g. do not just delete the check) -- it should still fail if the stylesheet link
  is missing or malformed.'
- 'SCAN FOR SIMILAR STALENESS: since this test file has apparently never been updated
  since its original creation, check its other 10 required snippets (title, journal-chat.js
  src, csrf_token, allowanceCount, messagesContainer, questionForm, questionInput,
  sendButton, grounding disclaimer text, "Test Member") against the CURRENT index.php
  to confirm none of the others have silently drifted stale in the same way -- if
  any others are found stale, fix them too and note each one in the handoff.'
definition_of_done:
- The full golden hammer suite (`DB_HOST=127.0.0.1 DB_NAME=journal_ai_test DB_USER=root
  DB_PASS=root php journalgpt/tests/security_and_eval_suite.php`) reports 9/9 suites
  passing, 0 failures.
- 'The fixed assertion still meaningfully verifies the stylesheet is linked correctly
  -- confirm by temporarily breaking the link in a local copy (e.g. renaming the href)
  and re-running the test to see it correctly fail, then restoring it, per this repo''s
  existing TDD convention (see other recent tasks'' handoffs this session for the
  pattern: prove a test can fail before trusting that it can pass).'
- Any other stale snippet assertions found during the scan are fixed and listed in
  the handoff, or the handoff explicitly states none were found.
- php -l passes on journalgpt/tests/JournalChatRenderTest.php.
