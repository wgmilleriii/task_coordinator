  with zero regressions -- the current app must keep working exactly as before for
  members using it today while this v3 work proceeds in parallel.'
- 'EXPLICITLY OUT OF SCOPE: AnswerSynthesizer, ClaimValidator (Phase 3-4). Do not
  change the live wiring T-PTG-020 established beyond inserting this ranking step
  between retrieval and synthesis.'
definition_of_done:
- EvidenceRanker.php exists per v3.md section 11's six ranking criteria, and demonstrably
  reduces/reorders a raw evidence set into a compact bundle.
- 'A new test file (journalgpt/tests/EvidenceRankerTest.php) covers at least: a redundant/duplicate
  passage being down-ranked or dropped, and a highly relevant passage being ranked
  above a tangentially related one for a specific test question.'
- Wired into the live path after T-PTG-020's retriever, before wherever synthesis
  currently happens (still the existing JournalAnswerService synthesis step at this
  point, since AnswerSynthesizer.php doesn't exist yet).
- The golden hammer suite (security_and_eval_suite.php) passes 9/9 with zero regressions.
- The existing test suite chain (AskEndpointTest, UsagePolicyTest, JournalAnswerServiceTest,
  ConversationStateServiceTest, ResearchPlannerTest, EvidenceRetrieverTest) still
  passes in full.
- php -l passes on all new/modified PHP files.
