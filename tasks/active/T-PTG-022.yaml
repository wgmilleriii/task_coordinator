- 'WHAT TO BUILD, per v3.md section 11 exactly: create `journalgpt/lib/EvidenceRanker.php`.
  Not every passage T-PTG-020''s EvidenceRetriever collects should go directly to
  the final answering model. Rank evidence by: relevance to user intent, relevance
  to conversation context, source quality, specificity, redundancy, citation resolvability.
  Output a compact evidence bundle for synthesis (v3.md section 11''s exact phrase).'
- 'GOLDEN HAMMER GATE (hard requirement, per Chip''s explicit direction this session):
  before merging to main, run `DB_HOST=127.0.0.1 DB_NAME=journal_ai_test DB_USER=root
