scope:
- 'CONTEXT FOR ANY AGENT PLATFORM PICKING THIS UP: read journalgpt/v3/v3.md sections
  2.1, 17-19 (Intellectual Property Protection, Bulk Extraction Protection, Public
  Sharing Review) before starting. Gated on T-PTG-024 (ClaimValidator) -- by this
  point the answer pipeline has fundamentally changed (planning, multi-query retrieval,
  ranking, synthesis with explanation-vs-Journal distinction, per-claim validation),
  so this phase re-audits the existing IP/security protections against the NEW pipeline
  shape, not just the old one.'
- 'WHAT TO REVIEW/HARDEN, per v3.md exactly: (1) section 17 -- confirm the browser
  never receives OpenAI API keys, vector-store credentials, corpus filesystem paths,
  extracted corpus dumps, or private storage credentials, across ALL the new lib classes
  added in Phases 1-4 (ConversationStateService, ResearchPlanner, EvidenceRetriever,
  EvidenceRanker, AnswerSynthesizer, ClaimValidator) -- a new class is a new place
  a leak could be introduced. (2) section 18 -- confirm bulk-extraction refusal (already
  tested in security_and_eval_suite.php''s TC-SEC-001/002 cases) still works correctly
  against the new multi-query retrieval pipeline, which by design fetches MORE passages
  per question than the old single-search pipeline -- verify this increased retrieval
  breadth has not created a new bulk-extraction loophole. (3) section 19 -- review
  the existing public conversation-sharing feature (find it in the codebase -- grep
  for "shared" conversations, `SharedConversationsTest.php` already exists) and confirm
  unauthenticated users still cannot gain protected PDF access via a shared conversation,
  even though shared conversations may now include the new explanation-vs-Journal-distinguished
  content and per-claim-validated citations from Phases 3-4.'
- 'GOLDEN HAMMER GATE (hard requirement, per Chip''s explicit direction this session):
  before merging to main, run `DB_HOST=127.0.0.1 DB_NAME=journal_ai_test DB_USER=root
  DB_PASS=root php journalgpt/tests/security_and_eval_suite.php` and confirm 9/9 PASS
  with zero regressions, including SharedConversationsTest.php and AuthAccessTest.php
  specifically.'
- 'EXPLICITLY OUT OF SCOPE: Phase 6 evaluation/tuning. This is a review-and-harden
  task, not a new-feature task -- if the review finds everything already correctly
  protected against the new pipeline, the DoD is still satisfied by documenting that
  finding with evidence, not by inventing unnecessary new restrictions.'
definition_of_done:
- A written review (in the handoff, not a new doc file unless the Worker judges one
  is needed) explicitly addresses all three v3.md areas (secret/credential exposure
  across the new Phase 1-4 classes, bulk-extraction refusal against the wider multi-query
  retrieval, and public-sharing PDF-access boundary) with concrete evidence for each
  -- either "confirmed already safe, here is the test/grep that proves it" or "found
  a gap, here is the fix."
- Any gap found is fixed, with a new or extended test proving the fix (e.g. extending
  SharedConversationsTest.php or security_and_eval_suite.php's existing TC-SEC-* cases).
- Add at least one NEW automated test case specifically targeting bulk-extraction
  attempts against the new multi-query retrieval pipeline (e.g. "give me everything
  you found across all your searches"), since this is a genuinely new attack surface
  the old single-search pipeline didn't have.
- The golden hammer suite (security_and_eval_suite.php) passes 9/9 with zero regressions.
- php -l passes on all modified PHP files.
