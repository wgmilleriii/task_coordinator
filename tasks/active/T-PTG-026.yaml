scope:
- 'CONTEXT FOR ANY AGENT PLATFORM PICKING THIS UP: read journalgpt/v3/v3.md sections
  24-26 (Evaluation Dataset, Evaluation Metrics, Observability) and section 32''s
  Phase 6 description before starting. This is the final phase, gated on T-PTG-025
  (IP hardening) AND T-PTG-015 (the original Phase 0 benchmark, for direct before/after
  comparison).'
- 'WHAT TO DO, per v3.md section 32 exactly: "Replay benchmark and tune: prompts,
  retrieval breadth, model choice, evidence limits, tier behavior, latency, cost."
  Run T-PTG-015''s full 30-50 example benchmark against the NOW-COMPLETE v2/v3 pipeline
  (Phases 1-5 all merged) and score it against v3.md section 25''s metrics: conversational
  understanding, retrieval quality, answer usefulness, citation accuracy, citation
  relevance, continuity, uncertainty handling, IP compliance, latency, cost.'
- 'THIS IS THE FINAL GO/NO-GO, not just a tuning pass: for every one of T-PTG-015''s
  original disappointing examples, the handoff must state whether the new pipeline
  actually fixes it (e.g. does the new pipeline correctly resolve the "why?" follow-up
  now that ConversationStateService + ResearchPlanner exist?) or whether it does not
  -- do not present an average score improvement as success if specific, previously-broken
  cases documented in the benchmark are still broken. v3.md''s own Success Criteria
  (section 34) is a concrete multi-turn conversation example ("What does the Journal
  say about false beats?" -> "What causes them?" -> "Is that different in wound strings?"
  -> "So what would you check first?") -- test this exact flow live as part of the
  evaluation.'
- 'GOLDEN HAMMER GATE (hard requirement, per Chip''s explicit direction this session):
  before merging any tuning changes to main, run `DB_HOST=127.0.0.1 DB_NAME=journal_ai_test
  DB_USER=root DB_PASS=root php journalgpt/tests/security_and_eval_suite.php` and
  confirm 9/9 PASS with zero regressions after every tuning iteration, not just once
  at the end.'
- 'EXPLICITLY OUT OF SCOPE: building any new pipeline component -- Phases 1-5 are
  done by this point, this phase only tunes what exists (prompts, thresholds, retrieval
  breadth, model/tier choice) based on the benchmark replay results. Do not add new
  lib classes here.'
definition_of_done:
- T-PTG-015's full benchmark is replayed against the complete new pipeline, and results
  are scored per v3.md section 25's metrics, with per-example before/after comparison
  (not just aggregate scores) for every originally-disappointing example.
- v3.md's section 34 success-criteria conversation flow (false beats -> causes ->
  wound strings comparison -> practical synthesis) is tested live and the handoff
  states plainly whether it now works as the PRD envisions.
- At least one tuning iteration is made based on benchmark results (prompt, retrieval
  breadth, evidence limit, or tier behavior adjustment) with a documented before/after
  score change, proving the tuning loop actually works, not just that a single pass
  was run.
- The golden hammer suite (security_and_eval_suite.php) passes 9/9 with zero regressions
  after all tuning changes.
- 'The handoff includes a clear final recommendation to Chip: is JournalGPT v3 ready
  to be the default experience for all members, or does it need further work before
  full rollout, with specific reasoning tied to the benchmark results.'
verification_command: DB_HOST=127.0.0.1 DB_NAME=journal_ai_test DB_USER=root DB_PASS=root
  php journalgpt/tests/security_and_eval_suite.php
