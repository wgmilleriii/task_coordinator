id: T-PTG-046
title: Fix broken citation links in history viewer for article_id=0
status: DONE
priority: P1
repo: newmexicoptg.org
lane: ANY
description: JournalAnswerService returns article_id=0 and url=null for vector chunks
  from articles not yet synced to the DB. The live chat respects this null URL and
  renders a plain text span. However, the PHP history viewer ignores the null URL
  and blindly reconstructs the hyperlink, resulting in broken links.
definition_of_done: index.php and featured.php are updated to check if $articleId
  > 0 before wrapping the citation chip in an <a href> tag. If $articleId is 0, it
  renders a span.
