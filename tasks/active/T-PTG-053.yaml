scope:
- 'Spec: sections 3 and 5 of docs/superpowers/specs/2026-08-17-coverage-atlas-design.md.
  Member-facing radar page (extend profile.php or new coverage.php following its
  pattern -- T-PTG-049 established profile.php as the member-dashboard precedent):
  one axis per article_topic_categories row, member score per axis = weighted
  distinct engagement over that territory''s tagged articles (read=1, discussed=2,
  quiz_passed=3, deduped per (article, type)), normalized against the territory''s
  total tagged-article count so big territories don''t dominate.'
- 'Rendering: no charting framework -- inline SVG polygon radar in the page, same
  no-build-step convention as admin_topic_matrix.php. Must render sanely at 0
  activity (empty radar, inviting copy) and with sparse taxonomy tagging.'
- 'The nudge: below the radar, the member''s 3 weakest axes each list up to 3
  suggested articles from that territory the member has NOT engaged, ranked by
  cross-member popularity (reuse T-PTG-049''s popular-but-unread query shape,
  re-targeted through article_index_topics).'
- 'HONEST-DATA GUARD: radar quality depends on human tagging coverage in
  admin_article_index_matrix.php (a separate, ongoing human effort). The page must
  surface tagging coverage ("N of 4,120 articles tagged so far") rather than
  presenting a thin-tag radar as truth.'
definition_of_done:
- Radar page renders for a member with zero activity, partial activity, and for a
  territory with zero tagged articles, without errors.
- Axis scoring proven by test - a member with one quiz_passed on a tagged article
  scores exactly 3 on that territory and 0 elsewhere; dedup proven (two reads of
  the same article count once).
- Nudge query proven by test - suggests only untagged-by-member articles from weak
  territories, popularity-ordered.
- Tagging-coverage line shows the true tagged/total counts.
- Golden hammer suite passes with zero regressions; php -l clean.
