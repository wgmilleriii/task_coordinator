scope:
- 'Spec: section 4 of docs/superpowers/specs/2026-08-17-coverage-atlas-design.md. CLI (cli/propose_tours.php)
  that drafts candidate tours/threads as status=draft rows for curator review in admin_tours.php.
  Inputs: article_index summary_keywords + core_skills + issue chronology (+ article_index_topics
  tags where present). One LLM pass per proposal via OpenAIClient (mock-mode testable, same
  as QuizGenerator), cost-capped: --limit N proposals per run, estimated cost logged, UsageLedger
  conventions respected.'
- 'Proposal shapes: (a) tour -- 5-8 articles sharing a theme with a one-line blurb and per-stop
  connective notes; (b) thread -- chronological sequence on one narrow question spanning 10+
  years (the spec''s "watch the craft argue with itself" shape; e.g. humidity-control advice
  over time). The model must only reference real article_index ids fed to it -- reject any proposal
  citing an id not in the candidate set (mirror QuizGenerator''s grounding-enforcement discipline:
  discard, never repair).'
- 'NEVER auto-publish: CLI writes drafts only. Duplicate-guard: skip proposing a tour whose
  title case-insensitively matches an existing tour.'
definition_of_done:
- With a mocked OpenAIClient response, the CLI writes a valid draft tour with ordered stops
  and connective notes; a response citing a fabricated article id is discarded with a logged
  warning and writes nothing.
- Drafts appear in admin_tours.php for curation; nothing member-visible changes.
- Duplicate-title guard proven by test.
- Golden hammer suite passes with zero regressions.
