id: T-PTG-065
title: Webhook Sync for Localhost Conversations
status: PEER_REVIEW
priority: P2
lane: ANY
repo: newmexicoptg.org
scope:
- 'Implement a webhook to synchronize localhost conversations to the production database.

  1. Create `journalgpt/api/sync_chat.php` to receive incoming conversation payloads.

  2. Protect the endpoint with a shared secret key (e.g. SYNC_SECRET).

  3. Modify `journalgpt/api/ask.php` (or wherever conversations are inserted) so that
  if a SYNC_ENDPOINT environment variable is set, it fires a background curl POST
  request with the conversation payload to the production server.

  4. Ensure error handling so that local generation does not fail if the webhook is
  unreachable.'
