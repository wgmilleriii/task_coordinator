id: T-PTG-066
title: "JournalGPT public guest access: 3-interaction trial, verified-email continuation, and citation-image-only source access"
status: CLAIMED
priority: P1
repo: newmexicoptg.org
lane: ANY
created_at: '2026-08-20T05:04:00Z'
dependencies: []
scope:
  - >-
    Product requirement from the owner: change the main JournalGPT login experience so it offers an explicit "Continue as Guest" / "Login as Guest" path in addition to the existing member login. A guest must be able to enter JournalGPT without an account and complete exactly 3 successful JournalGPT interactions before verified email registration is required. Existing members must continue to be able to log in normally without consuming a guest trial.
  - >-
    Guest identity and usage accounting must be server-authoritative. Use a cryptographically random opaque guest identifier stored in a Secure, HttpOnly, SameSite cookie and a server-side guest-session/usage record. Browser localStorage or client-supplied counters must never be authoritative. Clearing UI state must not by itself reset the server-side trial. IP/network signals may be used as secondary abuse controls but must not be the primary guest identity because shared networks, carrier NAT, and privacy relays make IP-only identity unreliable.
  - >-
    The owner requested GPS/location tracking in addition to cookies. Implement this as consent-based browser geolocation only: the guest UI may request navigator.geolocation permission with a clear purpose disclosure, and the server may store the returned coordinates/accuracy/timestamp only after the browser/user grants permission. Do not attempt to bypass browser permission, infer precise GPS from IP, or make geolocation denial silently reset or bypass the 3-interaction trial. The task must document what location data is stored, retention expectations, and how a user can proceed if location permission is denied.
  - >-
    Count only successful JournalGPT answer interactions toward the 3-interaction trial. Validation errors, blocked requests, server failures, and failed model calls must not consume the allowance. Before interaction 4, enforce the gate before any OpenAI/model request so an exhausted guest cannot generate model cost. The API must return an explicit machine-readable registration-required state/code and remaining interaction count.
  - >-
    After the third successful interaction, require email registration before any further JournalGPT interaction. Registration must collect an email address, create or stage a non-administrator account/identity, generate a cryptographically secure single-use verification token with an expiry, send a verification email containing a confirmation URL, and keep JournalGPT locked until the user clicks the confirmation link successfully. Merely submitting an email form or receiving the email is not sufficient. The confirmation endpoint must be idempotent/safe on repeat clicks and must not expose raw tokens in persistent logs.
  - >-
    After successful email confirmation, return the user to JournalGPT and preserve the guest session context. The application must associate the verified identity with the guest session so the user can continue without being placed back into an exhausted anonymous state.
  - >-
    Public source rights remain intentionally narrower than registered-member rights. Guests may receive citation page images only, with a lifetime anonymous-trial maximum of 10 citation images delivered per guest identity. The question/interaction allowance (3) and citation-image allowance (10) are separate counters. Once the image allowance is exhausted, any remaining allowed guest answer may still return citation metadata but no additional citation page image.
  - >-
    Guests must never receive complete PDFs. Enforce this on the server, not just in the UI. Audit journalgpt/source.php and every source/citation route reachable from guest mode. Any guest attempt to use download=pdf, a PDF proxy/stream endpoint, a backing Google Drive URL, local source path, or equivalent direct-object route must fail closed before file resolution/redirect/streaming.
  - >-
    Add a dedicated guest-safe citation-image delivery path. It must validate that the requested page is an authorized citation for the guest-visible answer, enforce the 10-image counter server-side, record successful deliveries, and return only an image format. A citation-render failure must fail closed and must never fall back to serving the PDF.
  - >-
    Preserve existing authenticated behavior and role boundaries. Public registration must never allow a user to self-select administrator or any privileged role. Guest mode should expose only the minimum features required for the 3-interaction public trial.
  - >-
    Add abuse and security controls appropriate to a public endpoint: pre-model rate limiting, CSRF or equivalent request-integrity protection, secure cookie flags, HTTPS-aware session handling, prompt-size limits, email-registration throttling, verification-token expiry/single use, and safe logging. Do not introduce invasive browser fingerprinting.
  - >-
    Public-facing copy must clearly explain the trial: guests get 3 interactions before verified email is required; source evidence may include a limited number of citation page images; complete PDFs are not part of guest access; location permission is optional/consent-based.
  - >-
    Integration constraint from task_coordinator README: newmexicoptg.org remains test-branch-only for ordinary fleet work. Worker implementation must occur in an isolated feature branch and merge to the repository's `test` integration branch after review; do not push or merge to `main` without separate authorization.
  - >-
    Documentation is required because this changes authentication, public-access rights, guest identity, email verification, geolocation handling, and source-delivery architecture. Add/update Dewey-compliant docs and reconcile the existing JournalGPT public-access whitepaper to the final 3-interaction verified-email model.
definition_of_done:
  - The main JournalGPT login page visibly offers both the existing member login and a guest-entry option.
  - A server-side guest identity exists with an opaque secure cookie, and exactly 3 successful JournalGPT interactions are allowed before registration is required; the 4th is rejected before any model/OpenAI call.
  - Failed validation, failed model calls, server errors, and blocked requests do not consume the 3-interaction allowance.
  - Browser geolocation is requested only through the standard permission flow with clear disclosure; declining does not reset or bypass the trial.
  - After interaction 3, registration sends a real verification email and continued use remains locked until the emailed link is successfully clicked.
  - Email verification uses a high-entropy expiring single-use token, handles replayed clicks safely, prevents self-assignment of privileged roles, and does not persist raw verifier tokens.
  - Successful confirmation transitions the same guest identity into a verified registered state and returns the user to JournalGPT with conversation continuity.
  - Guest source delivery is image-only and enforces a maximum of 10 citation page images independently from the 3-interaction counter.
  - Direct guest requests for source.php?download=pdf and equivalent source paths are forbidden before PDF bytes or backing URLs are disclosed.
  - Guest citation images are served through an authorization-aware image-only endpoint that validates the citation/page, enforces the counter, and fails closed.
  - Existing authenticated member/admin behavior continues to pass regression tests; guest mode cannot access member/admin-only routes.
  - Public endpoint protections include verification-email throttling, secure cookies/HTTPS handling, request integrity protection, and safe generic errors.
  - Public-facing copy and docs accurately state 3 guest interactions, verified email thereafter, up to 10 guest citation images, no guest PDFs, and consent-based location handling.
  - Verification includes automated guest-boundary tests, the canonical security/evaluation suite, and a test-deployment walkthrough where available.
verification_command: >-
