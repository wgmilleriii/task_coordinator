id: T-PTG-067
title: Live Engine B refresh on a cooldown, so the conversation color bar evolves
  as the chat continues
repo: newmexicoptg.org
priority: P2
lane: ANY
status: PEER_REVIEW
created_at: '2026-08-18T22:40:00-06:00'
dependencies:
- T-PTG-066
scope:
- 'Chip''s ask: "I want bars to evolve and change in color as the conversation continues."
  T-PTG-066 makes the bar appear instantly (Engine A only, free). This task adds the
  real LLM-scored half (Engine B) back in on a live cadence instead of only via the
  manual admin batch, so the bar''s shape actually sharpens/shifts as more is discussed
  -- without calling OpenAI on every single message (cost + latency).'
- 'Cooldown policy: recompute Engine B (ConversationTopicWeightRunner::scoreEngineB())
  for a conversation when BOTH (a) at least N messages (suggest N=4, confirm with
  Chip or pick a sensible default and document the reasoning) have been added since
  the last Engine B computation, AND (b) the org monthly budget check (UsagePolicy)
  passes -- reuse the existing budget-skip behavior from ConversationTopicWeightRunner
  rather than duplicating it.'
- This is a SEPARATE trigger path from the T-PTG-066 live Engine A write and from
  the existing batch job -- do not let all three race and double-log usage_events
  for the same conversation. Reuse scoreEngineB()'s existing usage_events logging
  (one row per real LLM call, T-PTG-030 convention) as the single source of truth;
  this task must not introduce a second logging path.
- The manual admin batch (admin_conversation_weights.php / topic_weights_attempted_at
  eligibility) keeps working as the backstop for conversations that go quiet before
  hitting the live cooldown threshold -- this task does not replace it, it just makes
  most conversations settle live instead of waiting for a manual batch click.
definition_of_done:
- 'Test proves: a conversation that accumulates >= N messages triggers exactly one
  live Engine B call and updates combined_weights_json; a conversation with fewer
  than N new messages since its last Engine B pass triggers zero live calls.'
- 'Test proves the live path and the batch path never double-bill: a conversation
  whose live cooldown already ran Engine B is not re-billed by the next admin batch
  run for the same content (extend the existing topic_weights_attempted_at semantics
  rather than inventing a parallel state).'
- Budget-exhausted behavior matches the batch job exactly (Engine A/live-partial result
  kept, Engine B silently skipped, no error surfaced to the member).
- Golden hammer suite passes with zero regressions; php -l clean.
