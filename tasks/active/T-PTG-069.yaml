scope:
- 'Chip''s ask: profile.php''s "My Research" section (e.g. "Business & Shop Practices
  -- 10 / 67 articles cited -- click to expand and view links to articles") currently
  shows counts with no actual links to the articles. Chip asked whether we should
  use AWS-hosted PDF links from the recently-ingested index -- checked and corrected:
  `article_index.issue_url` (journalgpt/migrations/018_article_index.sql, populated
  from journalgpt/data/article_index.csv) is NOT AWS-hosted -- it''s a `my.ptg.org`
  HigherLogic document-library download link (`DownloadDocumentFile.ashx?DocumentFileKey=...`).
  Chip confirmed 2026-08-18: use these HigherLogic links.'
- Wire "click to expand" in profile.php's My Research section to list the actual cited
  articles per category (find the citation source -- likely journalgpt_citation_logs
  per journalgpt/migrations/016_journalgpt_citation_logs.sql, or wherever "N / 67
  articles cited" is currently counted from) with each article title linking out to
  its `article_index.issue_url`.
- These are `my.ptg.org` member-portal links -- they will require the member to already
  be logged into my.ptg.org in their browser (separate session from this app); do
  not attempt to proxy or embed the PDF, just link out target="_blank" and say so
  in adjacent copy if it reads as unclear.
- Not every article_index row has a non-null issue_url or a resolvable link to the
  citation-log's article identity -- some citations may trace to `articles`/`article_topics`
  (issue-level) rather than `article_index` (per-article) rows entirely, since these
  are deliberately separate tables (see 018_article_index.sql's docblock). Figure
  out which table actually backs "N / 67 articles cited" today before wiring links
  -- do not assume it's article_index without checking.
definition_of_done:
- 'Test proves: expanding a "My Research" category renders one link per cited article,
  pointed at the correct issue_url when present, and degrades gracefully (no dead
  link, no fatal) when an article''s issue_url is null.'
- Manual verification via the browse skill that clicking a category expands to real
  article links.
- Golden hammer suite passes with zero regressions; php -l clean.
