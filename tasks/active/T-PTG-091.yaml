  actor: Claude-Sonnet-Session
  details: 'Stage A: page earns its place -- it is not a separate visual page at all but a thin wrapper
    that renders index.php''s exact member chat shell via output buffering and injects guest-specific
    config/CSS/JS around it, so guests get the same experience as members with capability limits layered
    on. No merge/rename/simplify needed; Stages B/C/D/E (layout/polish/colorize/typeset) are inherited
    from index.php and guest-shared.css, out of scope for this file specifically. Stage F (harden): the
    guest-state DB lookup (GuestAccess::state()) had no error handling -- a DB hiccup would have thrown
    an uncaught exception before index.php even rendered, showing a raw fatal-error page instead of the
    chat shell. Wrapped in try/catch with a safe zero-remaining fallback so the shell still renders and
    degrades gracefully (guest sees 0 interactions/images remaining rather than a blank crash) if guest
    state can''t load. Verification: php -l clean, detect.mjs run (no new findings introduced), golden
    hammer suite 28/28 pass. Deployed: commit 363dbb0, both test and main FTP deploys confirmed successful
    via gh run view.'
