id: T-PTG-108
title: Conversation-wide quiz creation wizard with citation-expanded grounding
repo: newmexicoptg.org
priority: P1
lane: ANY
status: CLAIMED
created_at: '2026-08-25T10:38:36-06:00'
dependencies:
- T-PTG-104
scope:
- Replace every JournalGPT chat "Create a quiz" action with a link to an authenticated
  quiz_create.php page keyed by conversation_id. The clicked answer remains usable
  as the compatibility anchor for existing quiz records and links, but quiz source
  selection is conversation-wide rather than limited to that single assistant answer.
- 'The first state on quiz_create.php must preserve the existing JournalGPT shell,
  responsive reading-width layout, typography, and themes; show a Back to conversation
  link; ask exactly "How would you like this quiz to be generated?"; and present two
  large choices: "Only on material from this conversation" and "Use any material from
  the citations in this conversation".'
- Below the choices, list every unique citation found across the full conversation.
  Reuse the existing secure Reader URLs, retain useful article/page labels, deduplicate
  repeated citations, and open citation links in a new tab with safe target/rel attributes.
  A citation that cannot be resolved to a full article bundle remains listed and can
  contribute transcript context, but it must not be represented as loaded full-article
  evidence.
- Conversation-only mode grounds quiz generation in the entire visible conversation
  transcript, including member questions and assistant answers, without loading full
  article bundles. Citation-expanded mode uses that same transcript plus the complete
  text of every uniquely cited article bundle that can be resolved through the existing
  article-index/bundle infrastructure; repeated citations must load a bundle only
  once. Preserve the existing requirement that every generated question maps to real
  citation evidence rather than weakening grounding.
- Use a regular CSRF-protected form submission and Post/Redirect/Get flow to create
  the quiz queue job before any worker kick is issued. Only after the committed job
  exists may quiz_create.php start the worker and begin lightweight status polling,
  eliminating the current independent enqueue-beacon/worker-beacon ordering race.
  Refreshing or revisiting the progress URL must resume the same member-owned job
  rather than enqueueing a duplicate.
- Keep chooser, progress, completion, and recoverable failure states on quiz_create.php.
  After a choice, show "Generating quiz" and "This may take up to a minute." (plus
  a truthful stage when available); on completion show "Your quiz is ready" with a
  prominent "Take your quiz now" link to the existing quiz.php experience; on failure
  or timeout show a plain explanation and a Try again path. If another heavy job is
  already running for the member, explain that it must finish before another quiz
  can begin.
- Authorize every conversation and job lookup against the signed-in member, reject
  guessed or cross-member IDs without leaking data, retain CSRF validation on job
  creation, and ensure a job_id cannot be paired with a different conversation_id.
  Do not expose article-bundle files directly; keep citation access behind the established
  authenticated Reader/article delivery paths.
- 'Do not add or alter database schema: test and production share the database. Carry
  the two-value source-scope selection as a validated internal token in an existing
  nullable job payload field (or an equivalently migration-free existing field), and
  reject all other values. Existing queued quiz jobs, legacy single-answer generation
  behavior/API compatibility, status polling, saved quiz lists, and quiz.php links
  must continue to work.'
- Deployment is test-only. Merge/push only to the test integration branch and verify
  the complete flow on the test site; do not deploy or push this task to main/production.
definition_of_done:
- From a real conversation, every Create a quiz link opens the authenticated chooser
  for that conversation, and a member cannot view or start a quiz wizard for another
  member's conversation or job by changing either ID.
- The chooser displays the exact approved prompt and two choices, plus a deduplicated
  conversation-wide citation list whose secure links open in a new tab; unresolved
  citations remain honestly identified without being treated as loaded article bundles.
- A focused test proves transcript-only mode includes all visible member/assistant
  turns while excluding full bundle text, and citation-expanded mode includes that
  transcript plus each resolvable unique cited article bundle exactly once.
- A focused queue-ordering test proves the job is committed before the worker kick,
  and browser-level verification proves chooser -> generating -> ready -> Take your
  quiz now works, refresh resumes the same job without duplication, and failure/timeout/already-running
  states are recoverable and clear.
- Legacy quiz jobs and existing quiz.php/list/status behavior remain compatible, including
  at least one regression test for the pre-wizard single-answer job path.
- PHP syntax checks, relevant focused JournalGPT tests, frontend syntax checks, and
  the full journalgpt/tests/security_and_eval_suite.php regression suite pass with
  zero regressions.
- The change is deployed only to the test branch/test site and the authenticated live-test
  walkthrough confirms citation links, both generation modes, reload recovery, ownership
  rejection, and a usable completed quiz; no production deployment and no database
  migration occur.
verification_command: php -l journalgpt/api/ask.php
