  details: Filed from Chip's approved 2026-08-25 design after the current chat-integrated
    quiz flow intermittently left accepted jobs unclaimed and froze the interaction.
    This task deliberately moves selection and lifecycle feedback to a reload-safe
    page, creates the job before starting the worker, keeps both source modes conversation-wide,
    and forbids a schema migration because test and production share the database.
    Human review is required for the new member-facing wizard; requires_doc_update
    is recommended because this changes the quiz entry and queue lifecycle.
