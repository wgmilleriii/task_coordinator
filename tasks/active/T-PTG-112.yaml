id: T-PTG-112
repo: pmtnm-resources
title: Create Quiz Curation Admin Dashboard
repo: newmexicoptg.org
priority: P1
lane: ANY
status: DONE
created_at: '2026-08-25T19:20:00Z'
scope:
- Create `journalgpt/admin_curate_quizzes.php` providing a copy/paste workbench for
  quiz curation.
- Display a list of articles that currently lack quizzes.
- Add an 'Export Prompt' button per article that copies the article's text alongside
  a strict JSON schema prompt for generating a multiple-choice quiz.
- Add a textarea for admins to paste the JSON response from an external LLM.
- Create an endpoint (e.g. `api/import_curated_quiz.php`) to parse the pasted JSON
  and insert it into `quizzes` and `quiz_questions`.
- Resolve the constraint that `quizzes` currently requires `conversation_id` and `source_message_id`
  (either by modifying the schema to allow NULLs for admin-curated quizzes, or by
  using a dedicated system conversation).
definition_of_done:
- Admins can view a list of articles missing quizzes.
- Admins can copy an LLM prompt containing the article text and JSON schema instructions.
- Admins can paste the resulting JSON back into the dashboard.
- The imported quiz is successfully saved to `quizzes` and `quiz_questions` tables.
- The application gracefully handles the database constraints on `quizzes`.
verification_command: php -l journalgpt/admin_curate_quizzes.php || true
