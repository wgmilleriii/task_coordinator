scope:
- 'Chip requested: after an assistant answer is given, add a button/action "Continue this
  conversation with different articles" that regenerates a response to the same question,
  but grounded in different source articles than the ones just cited -- i.e. explicitly excluding
  the article(s)/chunk(s) already used for that answer, so a member who feels the first answer
  missed the mark (or wants a second perspective) can ask the system to look elsewhere in
  the corpus.'
- 'Needs design before implementation (NOT started this session): where the exclusion list
  lives (per-message? per-conversation running exclusion list across multiple "different articles"
  clicks?), how it plugs into EvidenceRetriever (v3_beta, issue-level, OpenAI vector store
  file_search -- excluding a specific chunk/file from an OpenAI-hosted vector store search
  may need query-level phrasing tricks rather than a hard exclude) versus EvidenceRetrieverV4
  (v4_beta, article-level, article_index-backed -- an actual article_id exclusion list is
  straightforward here), and whether this becomes a new message in the SAME conversation (most
  natural per the request''s framing) or spins off a new conversation the way T-PTG-109''s
  v4-relaunch does.'
- 'Open design question worth resolving with Chip before scoping further: does this apply
  to both v3_beta and v4_beta, or is it v4_beta-only given the article-level-exclusion mechanism
  is far more natural there than in v3_beta''s vector-store search.'
