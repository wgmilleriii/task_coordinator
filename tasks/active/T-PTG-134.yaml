id: T-PTG-134
title: 'all_quizzes.php: most quizzes show a generic "Journal Quiz" title, hard to scan the list'
repo: newmexicoptg.org
priority: P3
lane: ANY
status: OPEN
created_at: '2026-08-26T00:00:00Z'
scope:
- 'Observed 2026-08-26 while spot-checking all_quizzes.php: of the ~223 GPT-curated quizzes (T-PTG-112/113),
  the vast majority show as a generic "Journal Quiz" card with no distinguishing title, generated by "Test
  PTG Member" -- because api/gpt_action_submit.php inserts `title` from the GPT''s payload, and most submissions
  apparently didn''t set a meaningful one. A handful of quizzes (the ones generated via the chat "Create a
  quiz based on this conversation" button) do show a real, specific title (the source question).'
- With ~223+ quizzes accumulating and more coming from T-PTG-128''s article-driven pipeline, a long list of
  identical "Journal Quiz" cards makes the page unusable for finding a specific quiz.
- 'Fix at the source: api/gpt_action_get_pending.php already returns the real article title in its payload
  (`title` field) -- gpt_action_submit.php should default to that / the citation_label rather than accepting
  an unlabeled "Curated Quiz" fallback silently. Consider a one-time backfill for existing null-titled quizzes
  using their first question''s citation_label.'
definition_of_done:
- New quizzes generated via the GPT action flow have a real, distinguishing title by default, not a generic
  placeholder.
- Existing generic-titled quizzes are backfilled with their citation_label (or an equivalent meaningful title)
  where derivable.
