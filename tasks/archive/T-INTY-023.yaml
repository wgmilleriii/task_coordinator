id: T-INTY-023
title: Pianos in the News - print sheet generator (scripts + PHP page)
repo: intypiano
priority: P2
lane: claude
status: DONE
owner: Claude
created_at: '2026-08-20T22:00:00-06:00'
dependencies: []
requires_doc_update: true
scope:
- Create piano_news/fetch_shortlist.py - scrapes worldpianonews.com's homepage/archive
  for recent article title, URL, date, and thumbnail; prints a numbered shortlist
  to the terminal for manual review. No image download or teaser writing at this stage.
- Create piano_news/build_issue.py - takes a manually-supplied list of picked article
  URLs plus their teaser text (provided as input, not generated by this script) and
  downloads the article's main image into piano_news/images/, generates a QR code
  PNG into piano_news/qr/ for each article's source URL (reusing the qr/qrlib.php
  QRcode::png() pattern already used by qr_report_generator.php), and writes piano_news/issue_data.json
  with title, teaser, image path, qr path, and source url for each article.
- Create piano_news_print.php at the repo root, following the print_labels_5162.php
  / qr_report_generator.php pattern - reads piano_news/issue_data.json and renders
  a single print-CSS page with 3-4 article cards (image, headline, teaser, QR code).
- Article selection and teaser rewriting are explicitly out of scope for this task
  - those happen interactively between Chip and Claude in chat, and the resulting
  picks/teasers are what gets fed into build_issue.py as input.
definition_of_done:
- piano_news/fetch_shortlist.py runs and prints a numbered list of recent worldpianonews.com
  articles (title, url, date) to stdout without error.
- piano_news/build_issue.py, given a sample list of 3-4 article URLs and teaser strings,
  produces piano_news/issue_data.json plus downloaded images and QR PNGs without error.
- piano_news_print.php passes php -l and, when issue_data.json is present, renders
  a page with all picked articles' images, headlines, teasers, and QR codes that print-previews
  as a single page in a browser.
verification_command: php -l ../intypiano-T-INTY-023/piano_news_print.php && python3
  -m py_compile ../intypiano-T-INTY-023/piano_news/fetch_shortlist.py ../intypiano-T-INTY-023/piano_news/build_issue.py
