id: T-INTY-024
title: admin/v2/normalization.php edits inventory.make, not pianos.make/model -- normalizing
  does nothing for v2 tenant data
repo: intypiano
priority: P1
lane: ANY
status: DONE
owner: Worker-Normalize1
created_at: '2026-08-13T00:00:00Z'
dependencies: []
scope:
- 'Confirmed by reading admin/v2/normalization.php lines 22-36: the "Mass Edit" form
  runs `UPDATE inventory SET make = ? WHERE make = ?` against the legacy v1 `inventory`
  table, then separately calls GazelleAPI to rename the same make on Gazelle''s side.
  It never touches the v2 `pianos` table (`make`/`model` columns). Per docs/experts/schema-catalog.md,
  `inventory` and `pianos` do not stay in sync -- there is no ongoing job that copies
  inventory rows into pianos, so this tool silently does nothing for data that only
  exists in `pianos`.'
- 'Confirmed this is a live, current problem, not theoretical: as of this audit, caut_sfusd
  (built by T-INTY-018/T-INTY-020-era work plus a fresh SFUSD import, see scripts/import_sfusd_v2.php)
  has 162 rows in `pianos`, zero rows in `inventory`, 74 pianos with a NULL `model`,
  and makes like `Steinway #444` and `School Piano` that are not real manufacturer
  names. intypiano_demo (the UNM tenant) has 126 rows in `pianos` with 19 `Unknown`
  makes and 44 NULL models. Running normalization.php against either tenant today
  updates 0 relevant rows.'
- 'Fix: retarget normalization.php''s local-update query at `pianos.make` (and extend
  it to also support `pianos.model`, since the DoD-relevant data quality problem includes
  blank models, not just wrong-spelling makes -- the current tool only ever handles
  make). Keep the Gazelle-side sync call (`GazelleAPI::getPianosByMake` / `updatePianoMakeModel`)
  -- that part is already correct, it just needs to also update the local pianos row
  set correctly.'
- Do NOT touch the `inventory` table write path -- leave it in place alongside the
  new `pianos` write path rather than removing it, since some other live surface may
  still read `inventory.make` and this task has not audited every caller. Adding a
  second, correct write path is in scope; deleting the old one is not.
- Do NOT attempt an automated fuzzy-match/typo-correction pass across all makes in
  this task -- this is a UI/query-target fix, not a data-cleaning pass. A human (or
  a later task) still drives which old-make to new-make corrections get applied through
  the existing Mass Edit form.
- CSRF protection (already present, hash_equals check at line 13) and the gazelle_api_key
  requirement must be preserved unchanged.
definition_of_done:
- 'Submitting the Mass Edit form with an old_make that exists in `pianos.make` (not
  `inventory.make`) actually updates the matching `pianos` rows, verified live against
  a running server (php -S localhost:2027 -t ., per CLAUDE.md''s "prefer running over
  reading" rule) -- e.g. correct ''Steinway #444'' to ''Steinway'' against caut_sfusd
  or a local copy of it, and confirm via a direct SELECT that pianos.make changed
  and the row count matches what the UI reported.'
- The existing inventory.make write path still runs (no regression) -- confirm by
  checking a make that exists in a tenant's inventory table still updates there too,
  if such a tenant/row is available to test against locally.
- php -l admin/v2/normalization.php passes.
- No change to the CSRF check or the Gazelle API key requirement.
