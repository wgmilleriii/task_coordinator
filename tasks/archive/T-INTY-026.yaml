id: T-INTY-026
title: Dynamic Booking Configuration & Multiple Tuners Support
status: DONE
repo: intypiano
priority: P1
lane: ANY
created_at: '2026-08-14T12:12:00Z'
scope:
- Introduce database tables/schema to manage institution-level scheduling rules (allowed
  days) and tuner assignments.
- Migrate initial settings to preserve backward compatibility (Tue/Thu/Fri, cap=3,
  single tuner).
- Update SlotAllocator.php and BookingManager.php to calculate availability dynamically
  based on these settings and available tuners rather than a hardcoded site-wide cap
  of 3.
- Refactor schedule_tuning_red.js to consume dynamic allowed-days arrays instead of
  hardcoded Day-Of-Week checks.
- Implement an admin UI (e.g., booking-admin.php or extend system_hub.php) to manage
  allowed days, tuners, and whitelist/blacklist exceptions.
definition_of_done:
- SQL migration script created for new booking rules and tuners.
- Admin interface allows managing allowed booking days and tuners without code edits.
- Frontend scheduling form respects dynamic allowed days correctly.
- Slot overlaps correctly enforce capacity equal to the number of configured tuners.
