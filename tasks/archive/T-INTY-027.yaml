scope:
- Re-introduce the legacy theme switcher interface with a live preview mode.
- Allow users/admins to dynamically customize their own theme properties (color scheme,
  font family, sizing/scaling).
- Ensure theme selections persist per-tenant or per-user, storing preferences in a
  V2-native table rather than relying on hardcoded CSS files.
- Re-architect the frontend CSS structure to consume dynamic CSS variables mapped
  to these database preferences.
definition_of_done:
- A new UI exists for admins to select, preview, and save theme configurations.
- The UI allows overriding core variables (colors, fonts, sizes).
- The theme dynamically applies across the application based on the active user/tenant
  preference without requiring manual CSS recompilation.
- No legacy V1 table patterns are introduced.
