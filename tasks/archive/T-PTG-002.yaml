dependencies:
- T-PTG-001
scope:
- "journalgpt/lib/JournalAnswerService.php \u2014 resolveCitationsFromChunks() (turns\
  \ EVERY entry in $retrievedChunks into a citation, one per chunk, regardless of\
  \ whether the model's answer actually drew on it) and fallbackExtractCitationsFromAnswer()\
  \ (Tier-4 corpus-wide phrase scan, capped at MAX_FALLBACK_CITATIONS = 6 per call\
  \ but still additive on top of chunk citations)."
- "This is the upstream cause behind T-PTG-001's symptom: File Search / Assistants\
  \ retrieval commonly returns 10-20+ chunks touching many issues/pages of the Journal\
  \ for a broad query (e.g. 'Golden Hammer Award recipients' spans years of issues).\
  \ Today every one of those chunks becomes its own citation entry, deduped only by\
  \ (article_uid, page) \u2014 never checked against whether the model's prose contains\
  \ an annotation actually pointing at that chunk."
- "T-PTG-001 fixes the numbering/footnote-list symptom (footnotes must match inline\
  \ markers 1:1). This task fixes the underlying data problem so citation volume itself\
  \ stays sane even before T-PTG-001's filtering: adjacent-page citations to the same\
  \ article should collapse into one entry with a page range rather than N separate\
  \ entries, and the Tier-4 answer-text fallback should only ever supplement \u2014\
  \ never dominate \u2014 a citation list."
definition_of_done:
- "resolveCitationsFromChunks (or its caller) collapses consecutive/adjacent pages\
  \ within the same article_uid into a single citation entry with a page range (e.g.\
  \ pp. 21-23) instead of 3 separate entries \u2014 verify against the real example\
  \ where article_id=145 pages 23/24/25 all cited separately in one answer."
- 'Tier-4 fallbackExtractCitationsFromAnswer results are clearly and structurally
  distinguished from directly-retrieved/annotated citations (e.g. a source: ''fallback_scan''
  vs source: ''retrieval'' field on each citation record) so downstream consumers
  (including T-PTG-001''s inline-matching logic) can tell which citations the model
  actually pointed to vs. which were discovered independently by scanning corpus text
  for matching phrases.'
- "No regression in existing grounded-answer tests \u2014 a genuinely single-source\
  \ answer still returns exactly one citation."
- New regression test added to journalgpt/tests/JournalAnswerServiceTest.php using
  a StubOpenAIClient with 10+ retrieved_chunks across multiple issues, asserting page-range
  collapsing and that fallback-scan citations are tagged distinctly from retrieval
  citations.
verification_command: cd journalgpt && php tests/JournalAnswerServiceTest.php
