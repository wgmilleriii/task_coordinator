- 'INTERPRETING THE VAGUE REQUEST: "better screen real estate management" plus "for
  when you''re in the car" plus "once a week" points at quick, low-frequency mobile
  glances at journalgpt, where wasted horizontal/vertical space on a small screen
  is the actual pain point -- not a request for a native app, offline mode, or voice
  interface (those would be separate, much larger asks the member did not describe).
  Scout confirmed a concrete, scoped root cause by reading the CSS directly: `journalgpt/assets/journal-chat.css:727`
  has a single `@media (max-width: 768px)` breakpoint that already handles the sidebar,
  chat header, message bubbles, and input area responsively -- but the `.engine-controls-bar`
  (containing the "Thinking Tier" and "Theme" dropdowns, added inline in `journalgpt/index.php:325-350`
  with no dedicated CSS class rules at all, `display: flex; justify-content: space-between`)
  has ZERO responsive handling. On a narrow phone viewport, two label+dropdown pairs
  side by side with `justify-content: space-between` is a plausible source of exactly
  the complaint: cramped controls, wasted/overflowing horizontal space, poor screen-real-estate
  use.'
- 'FIX SCOPE: add a `@media (max-width: 768px)` rule (reuse/extend the EXISTING breakpoint
  at journalgpt/assets/journal-chat.css:727 -- do not introduce a second, differently-valued
  breakpoint) that makes `.engine-controls-bar` and its two child groups (`.model-select-group`,
  `.theme-select-group`) lay out compactly on mobile: reduce wasted horizontal space
  (e.g. stack the two groups vertically, or shrink label text/hide the "Thinking Tier:"/"Theme:"
  text labels down to compact icon-only or abbreviated controls at this breakpoint,
  Worker''s design call -- state the chosen approach and why in the handoff) while
  keeping both controls fully usable (44px minimum touch target height, matching this
  codebase''s existing mobile touch-target convention already used elsewhere in the
  same media query, e.g. `.sidebar-toggle-btn`''s `min-height: 44px`).'
- DO NOT MOVE THE INLINE STYLES WHOLESALE INTO CSS AS PART OF THIS TASK unless necessary
  for the responsive fix itself -- `.engine-controls-bar`'s current inline-style approach
  in index.php is pre-existing and out of scope to refactor generally; only add what's
  needed to make it responsive at the mobile breakpoint (a `@media` block naturally
  overrides inline styles via specificity/`!important` if truly needed, or the Worker
  may add a plain CSS class selector matching the existing class names already present
  in the markup -- `.engine-controls-bar`, `.model-select-group`, `.theme-select-group`
  -- which is the cleaner approach and should be preferred).
- 'EXPLICITLY OUT OF SCOPE: no native app, no offline mode, no voice interface, no
  changes to any other page''s mobile layout (this request is specifically about the
  Thinking Tier/Theme controls bar on index.php, the only place this bar exists).
  Do not touch the already-working mobile responsive rules for sidebar/header/messages/input
  in the same media query block -- only add to it.'
definition_of_done:
- 'A `@media (max-width: 768px)` rule targets `.engine-controls-bar`, `.model-select-group`,
  and `.theme-select-group` and demonstrably reduces wasted horizontal space compared
  to today''s layout (Worker''s chosen approach, documented in the handoff with before/after
  screenshots via the `/browse` skill -- never `mcp__claude-in-chrome__*` tools directly,
  per this project''s CLAUDE.md -- at a 375px-wide viewport, a common phone width).'
- Both the Thinking Tier and Theme dropdowns remain fully functional and reachable
  with at least a 44px touch target at the mobile breakpoint, matching this codebase's
  existing mobile touch-target convention.
- No regression to the existing desktop layout (viewport wider than 768px) -- verify
  via `/browse` screenshot that the engine-controls-bar looks unchanged above the
  breakpoint.
- No regression to any other already-working mobile responsive behavior in the same
  media query block (sidebar toggle, chat header, message bubbles, input area) --
  confirm via `/browse` screenshot at 375px that these still look correct.
- php -l passes on journalgpt/index.php.
- The existing test suite still passes in full -- journalgpt/tests/AskEndpointTest.php,
