scope:
- 'CONTEXT FOR ANY AGENT PLATFORM PICKING THIS UP: read journalgpt/v3/v3.md sections
  9-10 (Multi-Query Journal Search, Evidence Retriever) and section 32''s Phase 2
  description before starting. This is the first task that actually integrates prior
  work into the live pipeline -- v3.md section 32 says "At this point, run the benchmark
  again. This is the first major go/no-go checkpoint," so this task''s DoD requires
  a benchmark comparison, not just unit tests.'
- 'WHAT TO BUILD, per v3.md section 10 exactly: create `journalgpt/lib/EvidenceRetriever.php`.
  Responsibilities: execute T-PTG-019''s ResearchPlanner-produced search queries (plural
  -- multiple targeted searches per v3.md section 9, not one literal-interpretation
  search) against the existing OpenAI File Search / vector store integration (reuse
  `journalgpt/lib/OpenAIClient.php`, do not rebuild retrieval plumbing that already
  works -- v3.md section 3 is explicit that existing OpenAI integration, vector-store
  indexing, and File Search must be preserved, not replaced); collect passages; normalize
  retrieval metadata; preserve source identity and page information; deduplicate overlapping
  chunks; prevent one source from dominating results; limit total evidence size.'
- 'THIS TASK DOES THE FIRST LIVE INTEGRATION: unlike T-PTG-018/019, this task DOES
  wire ResearchPlanner + EvidenceRetriever into an actual code path -- but per v3.md
  section 27 (Failure Handling), it must degrade gracefully: "Planner unavailable
  -> use direct retrieval" and "One search fails -> continue with successful searches
  when sufficient." Do not make the new pipeline a hard replacement with no fallback
  -- if you cannot safely make it the default live path without risking a production
  regression, wire it behind a clearly-named feature flag/tier option instead and
  say so explicitly in the handoff (Worker''s judgment call, but must be justified,
  not silently punted).'
- 'THE GO/NO-GO CHECKPOINT, per v3.md section 32: after this task, replay T-PTG-015''s
  benchmark against BOTH the old pipeline and the new EvidenceRetriever-based pipeline
  and compare retrieval quality (did it find the right Journal material for the benchmark''s
  documented disappointing cases, especially the follow-up and multi-source categories).
  This comparison result belongs in the handoff and determines whether later phases
  (3-6) are worth continuing -- do not just claim success without this comparison.'
- 'EXPLICITLY OUT OF SCOPE: EvidenceRanker (T-PTG-021), AnswerSynthesizer, ClaimValidator.
  Do not remove or bypass the existing citation resolver -- v3.md section 15 requires
  preserving it; this task only improves what evidence FEEDS the existing resolver,
  it does not replace the resolver itself.'
definition_of_done:
- EvidenceRetriever.php exists per v3.md section 10's responsibilities, executes multi-query
  plans from ResearchPlanner, deduplicates, and bounds evidence size.
- A new test file (journalgpt/tests/EvidenceRetrieverTest.php) covers multi-query
  execution, deduplication of overlapping chunks, and graceful degradation when a
  single search fails.
- The new pipeline is wired into an actual reachable code path (default or behind
  a stated flag/tier per this task's scope), with graceful fallback to direct retrieval
  if the planner is unavailable, per v3.md section 27.
- The Go/No-Go benchmark comparison from this task's scope is performed and its result
  (better, worse, or mixed retrieval quality vs. the old pipeline, with specifics)
  is recorded plainly in the handoff -- this is the single most important piece of
  evidence for whether Phase 3+ should proceed.
- 'GOLDEN HAMMER GATE (hard requirement, per Chip''s explicit direction this session):
  before merging to main, run `DB_HOST=127.0.0.1 DB_NAME=journal_ai_test DB_USER=root
  DB_PASS=root php journalgpt/tests/security_and_eval_suite.php` and confirm 9/9 PASS
  with zero regressions. This task is the FIRST to wire new code into a live path
  -- this gate is especially critical here, since a mistake could break the app for
  members using it today.'
- The existing test suite still passes in full (AskEndpointTest.php, UsagePolicyTest.php,
  JournalAnswerServiceTest.php, ConversationStateServiceTest.php, ResearchPlannerTest.php)
  -- 0 regressions to the existing citation-grounded RAG lane.
- php -l passes on all new/modified PHP files.
