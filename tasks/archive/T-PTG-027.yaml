scope:
- 'BACKGROUND: T-PTG-026 (Phase 6 replay/tuning, merged to test at 41f365f) found
  and directly reproduced a real architectural gap while testing v3.md section 34''s
  live 4-turn conversation flow. journalgpt/lib/ConversationStateService.php has a
  fully-implemented updateState() method, but grep confirms NOTHING in JournalAnswerService::ask()
  (or anywhere else in the v3_beta pipeline) ever calls it. Running journalgpt/v3/section34_flow.php
  live (the exact false-beats -> causes -> wound-strings -> practical-check flow from
  v3.md section 34) proves this directly: every one of the 4 turns shows "Persistent
  Conversation State: None" reaching ResearchPlanner, on every single turn.'
- 'WHY THIS ISN''T A BLOCKING BUG TODAY, BUT IS A REAL GAP: the section-34 flow still
  "worked" in T-PTG-026''s replay because it fit inside ConversationContext''s bounded
  ~6-message recent-turn window, which independently carries enough of the last few
  turns'' text for ResearchPlanner to derive a reasonable follow-up query. But this
  is a fallback the architecture was never meant to rely on alone -- v3.md''s ConversationStateService
  is specifically meant to carry persistent topic/entity/research state ACROSS a conversation,
  not just the last few raw messages. Any conversation longer than that bounded window
  (a member asking many follow-ups over one extended session) will silently lose whatever
  the persistent-state layer was supposed to be tracking, with no error or degraded-mode
  signal to the user or to logs -- it just quietly never engages.'
- 'WHAT TO DO: wire ConversationStateService::updateState() into JournalAnswerService::ask()''s
  v3_beta branch so that persistent state is actually written after each turn (read
  ConversationStateService.php''s existing updateState() signature and ResearchPlanner.php''s
  consumption of getState() output to determine what state shape is expected -- do
  not redesign the state shape, just wire the existing write path that was never connected).
  Confirm via a live multi-turn test (extend or reuse journalgpt/v3/section34_flow.php,
  or a longer synthetic conversation exceeding ConversationContext''s bounded window)
  that "Persistent Conversation State: None" no longer appears on turns after the
  first, and that a conversation LONGER than the bounded recent-turn window still
  correctly carries topic/entity context via the now-populated persistent state layer
  (this is the actual regression test the bounded-window fallback was masking -- a
  short flow like section 34''s 4 turns won''t prove this by itself).'
- 'GOLDEN HAMMER GATE (hard requirement, per Chip''s explicit direction this session):
  before merging to main, run `DB_HOST=127.0.0.1 DB_NAME=journal_ai_test DB_USER=root
  DB_PASS=root php journalgpt/tests/security_and_eval_suite.php` and confirm 9/9 PASS
  with zero regressions.'
- 'EXPLICITLY OUT OF SCOPE: redesigning ConversationStateService''s state shape or
  ResearchPlanner''s consumption of it -- both already exist and are presumed correct;
  this task only connects the missing write path. Do not flip any default-preset or
  rollout toggle -- v3_beta remains opt-in pending Chip''s separate go/no-go decision
  referenced in T-PTG-026''s handoff.'
definition_of_done:
- ConversationStateService::updateState() is called from JournalAnswerService::ask()''s
  v3_beta branch after each turn, using the existing state shape (no redesign).
- 'A live multi-turn test proves persistent state survives PAST ConversationContext''''s
  bounded recent-turn window (not just within it, which the section-34 flow alone
  cannot prove) -- either a new automated test or an extended manual replay script,
  with before/after output showing "Persistent Conversation State: None" no longer
  appearing on later turns.'
- The golden hammer suite (security_and_eval_suite.php) passes 9/9 with zero regressions.
- php -l passes on all modified PHP files.
- The handoff states plainly whether this closes the gap T-PTG-026 identified, or
  whether it surfaces a further issue.
