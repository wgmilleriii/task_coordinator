scope:
- 'SUPERSEDES T-PTG-043 ("Phase 2: RAG Pipeline Optimization"), which was filed
  against an original, unrelated agent session''s worktree and never actually landed
  on `test`. T-PTG-043 is left unmodified in tasks/active/ as a historical record --
  see journalgpt/docs/20-Architecture/2026-08-13-metadata-analytics-epic-integration.md
  Background section for the audit findings.'
- 'REAL SCOPE ACTUALLY SHIPPED: `journalgpt/lib/AnswerSynthesizer.php` was modified
  so the v3_beta pipeline''s evidence chunks are formatted as `<chunk id="uid:page">`
  and the LLM is instructed (in AnswerSynthesizer''s own appended instructions only --
  NEVER in JournalAnswerService::getSystemInstruction(), which is shared with the
  legacy File-Search pipeline and must keep emitting/expecting original 【】-style
  annotations) to cite using `[article_uid:page]` tags. `journalgpt/lib/JournalAnswerService.php`
  gained a new `loadMetadataIndex()` method (consuming T-PTG-046''s corpus_metadata.json)
  and a new citation-resolution path that parses `[uid:page]` tags out of the delivered
  answer text and marks a citation `page_verified: true` ONLY when its (article_uid,
  page) pair is actually present among that turn''s retrieved evidence chunks --
  falling through to the pre-existing resolveCitationsFromChunks()/fallback path
  when unverified.'
- 'CORRECTION vs the original T-PTG-043 narrative -- this is the core defect the
  audit found and this phase exists specifically to fix: the original branch''s citation-format
  change hardcoded `page_verified => true` for every citation resolved via its new
  path, with NO actual verification that the LLM-claimed page number was real --
  a regression from the OLD path''s genuine verification (spec Background, bullet
  3). This corrected implementation closes that hole: an LLM that invents or misremembers
  a page is never trusted.'
- 'A second, harder-to-catch bug was found and fixed during this phase''s own review
  round (commit 2ffe0e5): the initial implementation verified a citation''s (uid,
  page) pair against retrieved chunks BEFORE ClaimValidator had a chance to strip
  the claim sentence the citation was attached to as ungrounded -- meaning a citation
  could still end up page_verified:true even though the sentence vouching for it
  never made it into the delivered answer. Verification is now gated on
  post-ClaimValidator text. The same commit also corrected the citation_logs migration
  schema (which the original T-PTG-044/045 branches had gotten wrong for the new
  format -- see T-PTG-048).'
definition_of_done:
- 'AnswerSynthesizer emits `<chunk id="uid:page">`-wrapped evidence and instructs
  the model to cite `[uid:page]`, scoped to v3_beta only -- the legacy pipeline''s
  shared system instruction is untouched.'
- 'JournalAnswerService::loadMetadataIndex() reads corpus_metadata.json, keyed by
  article_id.'
- 'A citation is page_verified:true if and only if its (article_uid, page) pair
  is present in that turn''s retrieved evidence chunks AND the claim sentence it''s
  attached to survives ClaimValidator''s grounding check -- proven by
  journalgpt/tests/CitationVerificationTest.php''s three tests: testVerifiedCitationMarkedPageVerifiedTrue,
  testInventedPageNotTrustedFromNewPath, testClaimStrippedByClaimValidatorNotPageVerified.'
- 'journalgpt/tests/V3PipelineEndToEndTest.php''s evidence-parsing regex updated
  for the new `<chunk id="...">` format (mechanical parity fix, fixtures/assertions
  unchanged).'
- 'CitationVerificationTest.php is registered in the golden hammer suite (suite
  15/18).'
- 'Golden hammer suite passes with zero regressions: `DB_HOST=127.0.0.1 DB_NAME=journal_ai_test
  DB_USER=root DB_PASS=root php journalgpt/tests/security_and_eval_suite.php` --
  confirmed 18/18 suites PASS.'
- 'php -l clean on all modified PHP files.'
