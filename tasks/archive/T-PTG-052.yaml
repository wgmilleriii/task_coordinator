scope:
- 'Spec: docs/superpowers/specs/2026-08-17-coverage-atlas-design.md section 3. New migration
  (019): member_article_activity (user_id, article_index_id, activity_type ENUM(read, quiz_passed,
  discussed), created_at; FK to article_index; append-only, no unique constraint -- repeat engagement
  is real signal for recency even though the radar aggregation deduplicates per (user, article,
  type)).'
- 'THE KEY TECHNICAL RISK, solve first: existing engagement signals are keyed to the ISSUE-LEVEL
  articles table (journalgpt_citation_logs.article_id, quiz_questions.article_id both FK to
  articles), but the radar needs PER-ARTICLE article_index rows. Build a resolver lib (e.g.
  lib/ArticleIndexResolver.php) mapping (issue-level article_id, page) -> article_index_id by
  joining articles.issue_date/volume/pdf_filename to article_index.issue_label (format like
  "Jan-79") and picking the article_index row whose page range contains the cited page (rows
  sorted by page within an issue; a row spans from its page to the next row''s page - 1). Resolver
  returns null on no-match; log unresolved hits, never guess. TDD the resolver against real
  fixture rows before wiring any hooks.'
- 'Hooks, all thin: (1) read -- source.php PDF opens that carry an article_index context, and
  citation renders in answers count via (3); (2) quiz_passed -- in submit_quiz_attempt.php after
  scoring, for each correctly-answered question resolve its article_id+page and log; (3) discussed
  -- where journalgpt_citation_logs rows are written, resolve and log alongside. Hooks must
  be fail-open: a resolver miss or insert failure must never break the member-facing request.'
definition_of_done:
- Migration 019 applied to the local test DB via cli/migrate.php with no errors.
- Resolver test proves correct mapping for a multi-article issue fixture (first, middle, last
  article by page) and returns null for an unmatchable page/issue.
- Each of the three hooks writes a correct member_article_activity row in its existing test
  (extend QuizTest / CitationLoggingTest rather than new suites where natural), and a forced
  resolver failure does not change the endpoint''s response.
- Golden hammer suite passes with zero regressions.
