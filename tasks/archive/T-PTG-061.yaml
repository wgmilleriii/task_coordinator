id: T-PTG-061
title: Dynamic Conversation Topic Weighting Engine
project: newmexicoptg.org
repo: newmexicoptg.org
status: DONE
priority: P1
lane: backend
description: "Build an asynchronous PHP service that dynamically updates conversation\
  \ topic weights. \nIt must calculate and store the weights using *two* separate\
  \ engines independently:\n\n- **Engine A**: A classic, fast keyword-based Dictionary\
  \ script.\n- **Engine B**: An LLM contextual analyzer (like GPT-4o-mini).\n\nThe\
  \ database should store the results of both engines separately. The UI (like the\
  \ color bar) will then consume an average of the two engines to display the final\
  \ weighted tags. This dual-track data storage will allow us to continuously analyze\
  \ and refine the Dictionary engine against the LLM's \"ground truth.\"\n"
