id: T-PTG-109
title: Launch a v3 conversation's question again through the v4_beta pipeline
repo: newmexicoptg.org
priority: P2
lane: ANY
status: DONE
created_at: '2026-08-25T11:00:00-06:00'
dependencies: []
scope:
- 'Filed retroactively after the fact: Chip asked for a "Launch this question again with v4"
  action on a v3 conversation, so v3 (issue-level EvidenceRetriever) and v4_beta (article-level
  EvidenceRetrieverV4) retrieval quality could be compared live from real member conversations
  rather than only via the offline v4/eval_ab.php script. Context: an Education Committee
  member (Jason Cassel) reported that a "Touchweight - Using Lead Weights in Keys" query returned
  an answer about a different article in the same issue, traced to v3''s issue-level (not
  article-level) retrieval granularity.'
- 'New api/launch_v4_conversation.php endpoint (CSRF + strict-owner-only, mirrors api/rename_conversation.php''s
  pure handler pattern): looks up the source conversation''s first user message, replays it
  through JournalAnswerService::ask() under preset=v4_beta (the only real-request path that
  can trigger v4_beta -- api/ask.php''s preset allowlist deliberately still excludes it),
  then retitles the resulting new conversation "<source title> (v4)" and links it back via
  a new conversations.source_conversation_id column (migration 038).'
- '"Launch with v4" button added to index.php''s chat header next to Share, shown only when
  the active conversation has messages and its title does not already end in "(v4)". journal-chat.js''s
  launchV4Conversation() posts to the endpoint and navigates to the new conversation on success.'
- Deployment is test-only per this session's working agreement (test.newmexicoptg.org shares
  production's database, so schema and code changes were deployed together and confirmed live
  before considering this done).
definition_of_done:
- Clicking "Launch with v4" on an owned v3 conversation with messages creates a new, correctly-titled
  "(v4)" conversation linked via source_conversation_id, and navigates there.
- A non-owner cannot trigger a relaunch of someone else's conversation (403); CSRF is enforced;
  a missing/nonexistent source conversation_id is rejected.
- 'tests/LaunchV4ConversationTest.php (4 assertions: owner success, non-owner reject, CSRF
  enforcement, invalid source id) passes, wired into tests/security_and_eval_suite.php as
  step 11b; full suite green with zero regressions.'
- 'Verified end-to-end on live test.newmexicoptg.org via gstack browse: logged in as member@ptg.org,
  opened an existing "Using lead weights in keys?" conversation, clicked the button, confirmed
  navigation to a new conversation titled "Using lead weights in keys? (v4)" and that the
  button correctly does not appear again on that new (v4) conversation.'
- 'tests/CompareV3V4Retrieval.php: a manual (non-CI) CLI diagnostic added alongside this feature,
  comparing v3_beta vs v4_beta for the same question side by side (answer text, grounding,
  cost, per-citation article/issue labels).'
